[project]
name = "ykh09242-unity-mcp-server"
version = "2.1.5"
description = "Unity MCP (ykh09242): Unity Editor integration via the Model Context Protocol (MCP)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Marcus Sanatan", email = "msanatan@gmail.com"},
    {name = "David Sarno", email = "david.sarno@gmail.com"},
    {name = "Wu Shutong", email = "martinwfire@gmail.com"}
]
maintainers = [{name = "ykh09242"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Code Generators",
]
keywords = ["mcp", "unity", "ai", "model context protocol", "gamedev", "unity3d", "automation", "llm", "agent"]
requires-python = ">=3.11"
dependencies = [
 "httpx>=0.28.1",
 "fastmcp==4.1.4",
 "mcp==2.3.0",
 "mcp-types==2.3.0",
 "pydantic>=2.14.1",
 "pydantic-core>=2.50.1,<3",
 "uvicorn>=0.54.0",
 "click>=8.5.0",
 "regex>=2026.9.29",
 "typing-extensions>=4.16.0",
 "pillow>=13.0.0,<14",
 "pyyaml>=6.0.3",
 "pathspec==1.1.1",
]

[project.optional-dependencies]
dev = [
    "pylint>=4.1.3,<5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0,<4",
    "ruff==0.17.3",
]

[project.urls]
Homepage = "https://ykh09242.github.io/unity-mcp/"
Documentation = "https://ykh09242.github.io/unity-mcp/"
Repository = "https://github.com/ykh09242/unity-mcp.git"
Issues = "https://github.com/ykh09242/unity-mcp/issues"
Changelog = "https://github.com/ykh09242/unity-mcp/releases"

[project.scripts]
mcp-for-unity = "main:main"
unity-mcp = "cli.main:main"

[build-system]
# Isolated uvx/pip builds do not consume the runtime lock. Pin the backend
# and wheel's packaging dependency here so archive installs use the reviewed set.
requires = ["setuptools==84.2.1", "wheel==0.48.0", "packaging==26.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
core = ["sdk_compatibility.json"]
services = ["skills_bundle.json", "test_results_view.html"]

[tool.setuptools]
py-modules = ["main"]

[tool.pylint.main]
py-version = "3.11"
recursive = true
persistent = false
jobs = 2

[tool.pylint.messages_control]
# Enforce correctness across production code, tests and repository tools.
# Naming, formatting, complexity and fixture conventions are outside this check.
disable = ["all"]
enable = [
    "E",
    "F",
    "anomalous-backslash-in-string",
    "assert-on-string-literal",
    "assert-on-tuple",
    "bad-format-string",
    "bad-open-mode",
    "binary-op-exception",
    "cell-var-from-loop",
    "dangerous-default-value",
    "duplicate-except",
    "duplicate-key",
    "invalid-envvar-default",
    "lost-exception",
    "return-in-finally",
    "self-assigning-variable",
    "unbalanced-dict-unpacking",
    "unbalanced-tuple-unpacking",
    "undefined-loop-variable",
    "unknown-option-value",
    "unreachable",
    "using-constant-test",
    "useless-with-lock",
]

[tool.pylint.reports]
reports = false
score = false

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == \"__main__\":",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
