<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" data-theme="${theme}">
  <title>Unity MCP</title>
  <style>
    :root {
      --blue: #2862c8;
      --blue-edge: #19459d;
      --teal: #0d8981;
      --teal-edge: #086761;
      --link: #08758c;
    }
    :root[data-theme="dark"] {
      --blue: #3277d8;
      --blue-edge: #8fc2ff;
      --teal: #11978e;
      --teal-edge: #73e4d4;
      --link: #69ddeb;
    }
    @media (prefers-reduced-motion: no-preference) {
      .sheen { animation: sweep 3.2s linear infinite; }
    }
    @keyframes sweep {
      from { transform: translateX(0); }
      to { transform: translateX(76px); }
    }
  </style>
  <defs>
    <path id="blue-face" d="M14.5 2 3.5 8.4v15.2l11 6.4Z"/>
    <path id="teal-face" d="m17.5 2 11 6.4v15.2l-11 6.4Z"/>
    <clipPath id="faces">
      <use href="#blue-face"/>
      <use href="#teal-face"/>
    </clipPath>
    <linearGradient id="light">
      <stop stop-color="#ddfbff" stop-opacity="0"/>
      <stop offset=".24" stop-color="#ddfbff" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#ddfbff" stop-opacity=".40"/>
      <stop offset=".76" stop-color="#ddfbff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ddfbff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M12 9h8 M12 16h8 M12 23h8" fill="none" stroke="var(--link)" stroke-width="2"/>
  <g stroke-width="1.5" stroke-linejoin="round">
    <g stroke="var(--blue-edge)">
      <use href="#blue-face" fill="var(--blue)"/>
      <path d="m3.5 8.4 11 6.4" fill="none"/>
    </g>
    <g stroke="var(--teal-edge)">
      <use href="#teal-face" fill="var(--teal)"/>
      <path d="m28.5 8.4-11 6.4" fill="none"/>
    </g>
  </g>
  <g clip-path="url(#faces)">
    <g transform="rotate(16 16 16)">
      <rect class="sheen" x="-34" y="-16" width="26" height="64" fill="url(#light)"/>
    </g>
  </g>
</svg>
