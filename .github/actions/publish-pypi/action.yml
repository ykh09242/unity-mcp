name: Publish Python distribution to PyPI
description: Build and publish the Python package from Server/ to PyPI
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.10"
        enable-cache: true
        cache-dependency-glob: "Server/uv.lock"

    - name: Build a binary wheel and a source tarball
      shell: bash
      run: uv build
      working-directory: ./Server

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        packages-dir: Server/dist/
