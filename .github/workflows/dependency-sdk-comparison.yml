name: Installed SDK dependency comparison

on:
  pull_request:
    branches: [main, beta]
    paths: &dependency-inputs
      - Server/**
      - MCPForUnity/package.json
      - tools/experiments/dependencies/**
      - .github/workflows/dependency-sdk-comparison.yml
  push:
    branches: [beta]
    paths: *dependency-inputs
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compare:
    name: Compare installed SDKs (Python ${{ matrix.python }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Compare independently installed SDKs with the same server wheel
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          UV_HTTP_RETRIES: '5'
          UV_HTTP_CONNECT_TIMEOUT: '30'
          UV_HTTP_TIMEOUT: '60'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          uv run --no-project --python '${{ matrix.python }}' python tools/experiments/dependencies/compare_sdk.py --output .tmp/sdk-comparison
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sdk-comparison-python-${{ matrix.python }}-${{ github.sha }}
          path: .tmp/sdk-comparison/
          if-no-files-found: warn
          retention-days: 30
