name: Codex MCP Interoperability

on:
  pull_request:
    branches: [main, beta]
    paths:
      - Server/**
      - tools/check_codex_interop.py
      - tools/tests/test_check_codex_interop.py
      - .github/workflows/codex-interop.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  codex_interop:
    name: Actual Codex 0.166.0 MCP client
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.14"
          enable-cache: false
      - name: Install locked test dependencies
        run: uv sync --directory Server --python 3.14 --locked --extra dev
      - name: Download checksum-pinned official Codex binary
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/codex-interop-bin"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/openai/codex/releases/download/rust-v0.166.0/codex-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/codex-interop-bin/codex.tar.gz"
          echo "a0bf572d2f93f056c6712a6da348e96078dc84f3885fd7be67807ef389cb3978  $RUNNER_TEMP/codex-interop-bin/codex.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/codex-interop-bin/codex.tar.gz" -C "$RUNNER_TEMP/codex-interop-bin"
          "$RUNNER_TEMP/codex-interop-bin/codex-x86_64-unknown-linux-musl" --version
      - name: Exercise actual Rust client against production CLI
        shell: bash
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          uv run --directory Server --locked --extra dev python ../tools/check_codex_interop.py \
            --codex "$RUNNER_TEMP/codex-interop-bin/codex-x86_64-unknown-linux-musl" \
            --output ../.tmp/codex-interop
      - name: Upload actual-client execution receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-interop-0.166.0
          path: .tmp/codex-interop/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
