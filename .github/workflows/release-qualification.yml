name: Exact beta release qualification

# Qualification never publishes. Ordinary license-free pushes retain their own
# checks and explicitly skip native qualification; dispatch requires real evidence.
on:
  workflow_dispatch: {}
  push:
    branches: [beta]
    paths:
      - MCPForUnity/**
      - unity-mcp-skill/**
      - .claude/skills/unity-mcp-skill/**
      - Server/**
      - TestProjects/UnityMCPTests/**
      - CustomTools/**
      - manifest.json
      - release-source-inputs.json
      - tools/**
      - .github/workflows/**
      - .github/actions/**

permissions:
  contents: read

concurrency:
  group: release-qualification-${{ github.ref }}
  # Native license owners must settle and return seats, even if beta advances.
  cancel-in-progress: false

jobs:
  identity:
    name: Identify exact receiving package and selected server
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      selected_server: ${{ fromJSON(steps.pair.outputs.matrix).include[0].selected_server_commit }}
    steps:
      - name: Require trusted beta event
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_EVENT: ${{ github.event_name }}
        run: |
          test "$SOURCE_REF" = refs/heads/beta
          case "$SOURCE_EVENT" in push|workflow_dispatch) ;; *) exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare immutable server and skill history for qualification
        if: vars.UNITY_RUN_LICENSED_TESTS == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CHECK_REVISION: ${{ github.sha }}
        run: |
          python3 tools/prepare_source_pin_history.py --revision "$CHECK_REVISION"
          python3 tools/prepare_source_pin_history.py --revision "$CHECK_REVISION" --component skill
      - name: Require current launcher source for qualification
        if: vars.UNITY_RUN_LICENSED_TESTS == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CHECK_REVISION: ${{ github.sha }}
        run: python3 tools/check_source_pin_drift.py --revision "$CHECK_REVISION" --require-current
      - name: Require both receiving skill mirrors to match their immutable pin
        if: vars.UNITY_RUN_LICENSED_TESTS == 'true' || github.event_name == 'workflow_dispatch'
        run: python3 tools/check_skill_pin.py --verify-git
      - name: Verify receiving SHA and committed selected-server pair
        id: pair
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 tools/bridge_pair_evidence.py plan --selection selected \
            --report reports/qualification-pair.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-pair-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/qualification-pair.json
          if-no-files-found: error
          retention-days: 30

  selected_server:
    needs: [identity]
    if: vars.UNITY_RUN_LICENSED_TESTS == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/source-pin-drift.yml
    with:
      selected_server: ${{ needs.identity.outputs.selected_server }}

  upm:
    needs: [identity]
    if: vars.UNITY_RUN_LICENSED_TESTS == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/unity-upm-install.yml
    with:
      ref: ${{ github.sha }}
      require_upm_install: true
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

  bridge:
    needs: [identity]
    if: vars.UNITY_RUN_LICENSED_TESTS == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/e2e-bridge.yml
    with:
      ref: ${{ github.sha }}
      pair_mode: selected
      require_native: true
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

  reload:
    needs: [identity, bridge]
    if: vars.UNITY_RUN_LICENSED_TESTS == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/assetgen-reload-tests.yml
    with:
      ref: ${{ github.sha }}
      run_assetgen_reload: true
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

  windows_vfx:
    needs: [identity]
    if: vars.UNITY_RUN_LICENSED_TESTS == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/unity-windows-vfx.yml
    with:
      ref: ${{ github.sha }}
    # The reusable contract must explicitly receive the environment secret names.
    # Activation still runs inside the protected windows-vfx job environment.
    secrets:
      WINDOWS_VFX_UNITY_EMAIL: ${{ secrets.WINDOWS_VFX_UNITY_EMAIL }}
      WINDOWS_VFX_UNITY_PASSWORD: ${{ secrets.WINDOWS_VFX_UNITY_PASSWORD }}
      WINDOWS_VFX_UNITY_SERIAL: ${{ secrets.WINDOWS_VFX_UNITY_SERIAL }}

  distribution:
    needs: [identity]
    if: vars.UNITY_RUN_LICENSED_TESTS == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/distribution-canary.yml
    with:
      ref: ${{ github.sha }}
      qualification_run: true

  player:
    # Wait for the Linux license owners and protected Windows VFX owner to settle.
    # The reusable Player job retains its shared Windows license concurrency gate.
    needs: [identity, reload, windows_vfx]
    if: vars.UNITY_RUN_LICENSED_TESTS == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/unity-player-tests.yml
    with:
      ref: ${{ github.sha }}
      backend: mono
      player_profile: standard
      require_player_e2e: true
    secrets:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

  package_shapes:
    # The two pinned Windows Editors use the Player serial after its owner returns the seat.
    needs: [identity, reload, windows_vfx, player]
    if: ${{ !cancelled() && needs.identity.result == 'success' && (vars.UNITY_RUN_LICENSED_TESTS == 'true' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/unity-package-shapes.yml
    secrets:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

  license_free:
    name: Report unavailable native qualification
    needs: [identity]
    if: github.event_name == 'push' && vars.UNITY_RUN_LICENSED_TESTS != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: |
          echo 'Native release qualification is SKIPPED: licensed execution is disabled.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Windows native package shapes are SKIPPED alongside the native bridge, reload, Windows VFX, and standalone Player. Ordinary license-free checks are not release qualification.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Dispatch this workflow on reviewed beta with licensed execution enabled to require all evidence at that exact SHA.' >> "$GITHUB_STEP_SUMMARY"

  qualification:
    name: Require complete release qualification
    needs: [identity, selected_server, bridge, reload, windows_vfx, player, package_shapes, distribution, upm]
    if: always() && (vars.UNITY_RUN_LICENSED_TESTS == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every exact-SHA evidence job
        id: require
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          QUALIFICATION_SHA: ${{ github.sha }}
        shell: python
        run: |
          import json
          import os

          results = json.loads(os.environ['JOB_RESULTS'])
          required = ('identity', 'selected_server', 'bridge', 'reload', 'windows_vfx', 'player', 'package_shapes', 'distribution', 'upm')
          missing = [name for name in required if results.get(name, {}).get('result') != 'success']
          selected = results.get('identity', {}).get('outputs', {}).get('selected_server')
          if not selected or results.get('selected_server', {}).get('outputs', {}).get('tested_sha') != selected:
              missing.append('selected-server Python suite at the package-pinned SHA')
          if results.get('upm', {}).get('outputs', {}).get('checked_sha') != os.environ['QUALIFICATION_SHA']:
              missing.append('exact-SHA UPM installation')
          if results.get('package_shapes', {}).get('outputs', {}).get('checked_sha') != os.environ['QUALIFICATION_SHA']:
              missing.append('exact-SHA Windows native package shapes')
          if missing:
              raise SystemExit('Release is NOT qualified: required evidence failed, was skipped or is missing: ' + ', '.join(missing))
          message = (
              'Exact receiving SHA `' + os.environ['QUALIFICATION_SHA'] + '` passed '
              'the focused Python suite at selected server `' + selected + '`, its real Editor bridge, both real reload probes, Windows VFX, '
              'Windows standalone Player (Mono, standard), Windows native package shapes on all pinned Editors, '
              'untouched UPM installation on floor/current Editors and full distribution canary. '
              'No publication was performed.'
          )
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(message + '\n')
          print(message)
