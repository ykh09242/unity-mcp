name: Unity Tests

on:
  workflow_dispatch: {}
  workflow_call:
    secrets:
      UNITY_LICENSE:
        required: false
      UNITY_EMAIL:
        required: false
      UNITY_PASSWORD:
        required: false
      UNITY_SERIAL:
        required: false
    inputs:
      ref:
        description: "Git ref to test (defaults to the triggering ref)."
        type: string
        required: false
        default: ""
  push:
    # Exclude beta and main: those branches re-trigger this workflow via
    # workflow_call from beta-release.yml / release.yml. Without the exclusion,
    # a push to beta that touches MCPForUnity/** fires this workflow twice
    # for the same SHA, and GitHub's auto-generated concurrency group
    # (`unity-tests-refs/heads/beta`) cancels the older run with the noisy
    # "higher priority waiting request" annotation.
    branches-ignore: [beta, main]
    paths:
      - TestProjects/UnityMCPTests/**
      - MCPForUnity/Editor/**
      - MCPForUnity/Runtime/**
      - .github/workflows/unity-tests.yml
      - tools/check_unity_test_results.py
      - tools/unity-versions.json
      - tools/unity_ci.py
      - tools/unity-ci/**
      - tools/unity_ci_packages.py
      - tools/unity-ci-packages.json
      - tools/unity-optional-tests.json
  # Same-repo PRs get a unity-tests status check on every open / push via this trigger
  # (mirrors python-tests.yml). Fork PRs ALSO fire this trigger but run in the fork's
  # context without secrets — the `license` gate job writes unity_ok=false and the test
  # job is skipped by its job-level `if:`, so the merge box shows "Skipped" rather than a
  # green check. The reason is also written to the gate job's step summary.
  #
  # There is deliberately no pull_request_target trigger here. Running fork-authored
  # C# through game-ci/unity-test-runner with UNITY_* secrets in scope is the classic
  # "pwn request" shape — an [InitializeOnLoad] script in the PR is enough to read
  # them. To test a fork PR, review the diff and push its branch into this repo; the
  # push trigger above then runs the full suite in a genuinely trusted context.
  pull_request:
    branches: [main, beta]
    paths:
      - TestProjects/UnityMCPTests/**
      - MCPForUnity/Editor/**
      - MCPForUnity/Runtime/**
      - .github/workflows/unity-tests.yml
      - tools/check_unity_test_results.py
      - tools/unity-versions.json
      - tools/unity_ci.py
      - tools/unity-ci/**
      - tools/unity_ci_packages.py
      - tools/unity-ci-packages.json
      - tools/unity-optional-tests.json

# Dedup runs for the same branch across push / pull_request / workflow_call.
# Same-repo PRs would otherwise fire both push (on the branch SHA) AND pull_request (on the PR);
# concurrency keeps only the newer in-flight run per branch.
permissions:
  contents: read

concurrency:
  group: unity-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Compute Unity version matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.set.outputs.versions }}
      optional_versions: ${{ steps.set.outputs.optional_versions }}
      optional_suites: ${{ steps.set.outputs.optional_suites }}
    steps:
      - name: Checkout version manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            tools/unity-versions.json
            tools/unity_ci.py
            tools/unity_ci_packages.py
            tools/unity-ci-packages.json
            tools/unity-optional-tests.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Select all supported Unity channels
        id: set
        run: |
          set -euo pipefail
          versions=$(python3 tools/unity_ci.py matrix)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          optional_versions=$(python3 tools/unity_ci_packages.py optional-matrix)
          echo "optional_versions=$optional_versions" >> "$GITHUB_OUTPUT"
          optional_suites=$(python3 -c 'import json; print(json.dumps(json.load(open("tools/unity-optional-tests.json"))["suites"], separators=(",", ":")))')
          echo "optional_suites=$optional_suites" >> "$GITHUB_OUTPUT"

  license:
    # Hoisted out of testAllModes so the gate is a JOB-level condition. A step-level `if:`
    # produces step-conclusion `skipped`, which contributes nothing to the job conclusion,
    # so the whole suite reported a green check having compiled and tested nothing. A job
    # skipped by a job-level `if:` reports "Skipped" in the merge box instead, which is
    # what a reviewer actually reads. Branch protection still treats a skipped required
    # check as satisfied, so this does not block merges.
    name: Detect Unity license secrets
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      unity_ok: ${{ steps.detect.outputs.unity_ok }}
    steps:
      - name: Detect Unity license secrets
        id: detect
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -e
          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && { [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; }; then
            echo "unity_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "unity_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain why the Unity suite will not run
        if: steps.detect.outputs.unity_ok != 'true'
        run: |
          echo "::warning::Native Unity tests will be SKIPPED - no license secrets in scope (normal for fork PRs). Optional package preparation still runs."
          {
            echo "## :warning: Unity tests will be SKIPPED"
            echo
            echo "No Unity license secrets were in scope, so **no native Unity test will be executed**."
            echo "The dependent job reports **Skipped**, not a pass."
            echo
            echo "GitHub withholds repository secrets from workflow runs triggered by a fork's pull request."
            echo "To get real signal, a maintainer must run the suite against this code from a trusted context -"
            echo "push the reviewed fork branch into this repo and the \`push\` trigger runs the full suite."
            echo
            echo "The separate license-free compile matrix and \`Run Python Tests\` DO run on fork PRs."
            echo "Optional package preparation also runs without a license; it validates dependencies, not optional C# execution."
          } >> "$GITHUB_STEP_SUMMARY"

  optionalPackageInputs:
    name: Prepare optional packages for Unity ${{ matrix.unity.version }}
    needs: [matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        unity: ${{ fromJson(needs.matrix.outputs.optional_versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      # The small compiler cache intentionally excludes graphics package sources.
      # Read the complete BuiltInPackages from the matching Editor image instead.
      - name: Prepare Unity Editor image
        id: editor
        env:
          UNITY_VERSION: ${{ matrix.unity.version }}
        run: python3 tools/unity_ci.py prepare "$UNITY_VERSION" --purpose tests

      - name: Prepare optional integration packages
        id: packages
        env:
          UNITY_VERSION: ${{ matrix.unity.version }}
          UNITY_IMAGE: ${{ steps.editor.outputs.image }}
        run: |
          set -euo pipefail
          python3 tools/unity_ci_packages.py prepare \
            --unity-version "$UNITY_VERSION" --image "$UNITY_IMAGE" \
            --output ".unity-ci/optional-$UNITY_VERSION" --include-optional

      # Preserve relative file: links and package executable modes across jobs.
      # The generator copies only source inputs, excluding Library and credentials.
      - name: Archive prepared optional project
        env:
          UNITY_VERSION: ${{ matrix.unity.version }}
        run: |
          set -euo pipefail
          tar -czf optional-project.tar.gz -C ".unity-ci/optional-$UNITY_VERSION" \
            package packages project resolved-packages.json

      - name: Upload prepared optional project
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: optional-project-${{ matrix.unity.version }}
          path: optional-project.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Report package preparation scope
        run: |
          echo "Optional package pins, minimum Editor versions and dependency closure validated. Native execution is reported by the separate licensed integration jobs." >> "$GITHUB_STEP_SUMMARY"

  optionalIntegrations:
    name: Optional ${{ matrix.suite.id }} on Unity ${{ matrix.unity.version }}
    needs: [matrix, license, optionalPackageInputs]
    if: needs.license.outputs.unity_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        unity: ${{ fromJson(needs.matrix.outputs.optional_versions) }}
        suite: ${{ fromJson(needs.matrix.outputs.optional_suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: optional-project-${{ matrix.unity.version }}
          path: .unity-ci/download

      - name: Restore prepared optional project
        env:
          UNITY_VERSION: ${{ matrix.unity.version }}
        run: |
          set -euo pipefail
          mkdir -p ".unity-ci/optional-$UNITY_VERSION"
          tar -xzf .unity-ci/download/optional-project.tar.gz -C ".unity-ci/optional-$UNITY_VERSION"

      - name: Prepare Unity Editor image
        id: editor
        env:
          UNITY_VERSION: ${{ matrix.unity.version }}
        run: python3 tools/unity_ci.py prepare "$UNITY_VERSION" --purpose tests

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .unity-ci/optional-${{ matrix.unity.version }}/project/Library
          key: Library-optional-${{ matrix.unity.version }}-${{ hashFiles('tools/unity-versions.json', 'tools/unity-ci-packages.json', 'tools/unity_ci_packages.py') }}

      # GameCI mounts this home at /root; Unity needs the parent directories before activation.
      - name: Prepare Unity preferences and license directory
        run: mkdir -p "$HOME/.local/share/unity3d/Unity"

      # Each fixture gets its own Editor process and owned scene bootstrap.
      - name: Run optional integration tests
        id: tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .unity-ci/optional-${{ matrix.unity.version }}/project
          unityVersion: ${{ matrix.unity.version }}
          customImage: ${{ steps.editor.outputs.image }}
          testMode: editmode
          customParameters: -testFilter ${{ matrix.suite.filter }}
          cliVersion: v0.1.69
          githubToken: ""
          artifactsPath: artifacts/optional

      - name: Require optional tests to execute and pass
        env:
          RESULTS_XML: artifacts/optional/editmode-results.xml
          TEST_RUN_OUTCOME: ${{ steps.tests.outcome }}
          REQUIRED_TESTS: ${{ toJson(matrix.suite.requiredTests) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          arguments = [sys.executable, "tools/check_unity_test_results.py", os.environ["RESULTS_XML"],
                       "--runner-outcome", os.environ["TEST_RUN_OUTCOME"]]
          for name in json.loads(os.environ["REQUIRED_TESTS"]):
              arguments.extend(["--require-test", name])
          sys.exit(subprocess.call(arguments))
          PY

      - name: Upload optional integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: optional-results-${{ matrix.unity.version }}-${{ matrix.suite.id }}
          path: |
            artifacts/optional/
            .unity-ci/optional-${{ matrix.unity.version }}/resolved-packages.json
          include-hidden-files: true
          if-no-files-found: error

  testAllModes:
    name: Test ${{ matrix.unity.channel }} Unity ${{ matrix.unity.version }} (${{ matrix.testMode }})
    needs: [matrix, license]
    if: needs.license.outputs.unity_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        testMode:
          - editmode
        unity: ${{ fromJson(needs.matrix.outputs.versions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      - name: Prepare Unity Editor image
        id: editor
        env:
          UNITY_VERSION: ${{ matrix.unity.version }}
        run: |
          set -euo pipefail
          python3 tools/unity_ci.py prepare "$UNITY_VERSION" --purpose tests

      - name: Prepare version-specific test packages
        id: packages
        env:
          UNITY_VERSION: ${{ matrix.unity.version }}
          UNITY_IMAGE: ${{ steps.editor.outputs.image }}
        run: |
          set -euo pipefail
          python3 tools/unity_ci_packages.py prepare \
            --unity-version "$UNITY_VERSION" --image "$UNITY_IMAGE" \
            --output ".unity-ci/$UNITY_VERSION"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.packages.outputs.project_path }}/Library
          key: Library-${{ matrix.unity.version }}-${{ hashFiles('tools/unity-versions.json', 'tools/unity-ci-packages.json', 'tools/unity_ci_packages.py') }}

      # GameCI mounts this home at /root; Unity needs the parent directories before activation.
      - name: Prepare Unity preferences and license directory
        run: mkdir -p "$HOME/.local/share/unity3d/Unity"

      # Run domain reload tests first (they're [Explicit] so need explicit category)
      # Both runner steps pin the action and its CLI. The floating v4 tag and the CLI's "latest"
      # release changed behavior under this workflow once (red beta since 2026-09-05); a pinned
      # cliVersion also skips the unauthenticated releases/latest lookup. Bump both on purpose.
      - name: Run domain reload tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        id: domain-tests
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ steps.packages.outputs.project_path }}
          unityVersion: ${{ matrix.unity.version }}
          customImage: ${{ steps.editor.outputs.image }}
          testMode: ${{ matrix.testMode }}
          customParameters: -testCategory domain_reload
          cliVersion: v0.1.69
          # Results are gated locally; this read-only job cannot publish Checks API results.
          githubToken: ""
          artifactsPath: artifacts/domain-reload

      # Preserve runner failures while reporting any NUnit failure details or missing results.
      - name: Check domain reload test results
        env:
          RESULTS_XML: artifacts/domain-reload/${{ matrix.testMode }}-results.xml
          TEST_RUN_OUTCOME: ${{ steps.domain-tests.outcome }}
        run: python3 tools/check_unity_test_results.py "$RESULTS_XML" --runner-outcome "$TEST_RUN_OUTCOME"

      - name: Run tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        id: tests
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ steps.packages.outputs.project_path }}
          unityVersion: ${{ matrix.unity.version }}
          customImage: ${{ steps.editor.outputs.image }}
          testMode: ${{ matrix.testMode }}
          cliVersion: v0.1.69
          githubToken: ""
          # Keep the preceding domain-reload XML out of the regular suite's result gate.
          artifactsPath: artifacts/editmode

      - name: Check test results
        env:
          ARTIFACTS_PATH: ${{ steps.tests.outputs.artifactsPath }}
          TEST_RUN_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          # `|| true` so a missing $ARTIFACTS_PATH (Unity crashed before producing any) doesn't trip
          # `pipefail` and skip the explicit empty-check diagnostic below.
          RESULTS_XML=$(find "$ARTIFACTS_PATH" -name '*.xml' 2>/dev/null | head -1 || true)
          if [ -z "$RESULTS_XML" ]; then
            echo "::error::No test results XML found — Unity may have crashed"
            exit 1
          fi
          python3 tools/check_unity_test_results.py "$RESULTS_XML" --runner-outcome "$TEST_RUN_OUTCOME"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.domain-tests.outcome != 'skipped'
        with:
          name: Test results for ${{ matrix.testMode }} on Unity ${{ matrix.unity.version }} (${{ matrix.unity.channel }})
          path: artifacts/
