name: E2E Bridge Smoke (deterministic, no LLM)

# Boots a headless Unity Editor, starts the Python MCP server's wire path, and
# drives a fixed sequence of real tool calls with exact assertions
# (Server/tests/e2e/bridge_smoke.py). Unlike claude-nl-suite.yml this needs
# NO Anthropic API key -- it is deterministic and cheap, so it can gate PRs and
# releases. It still needs Unity license secrets to boot the Editor.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      pair_mode:
        type: string
        default: auto
      require_native:
        type: boolean
        default: false
    secrets:
      UNITY_LICENSE:
        required: false
      UNITY_EMAIL:
        required: false
      UNITY_PASSWORD:
        required: false
      UNITY_SERIAL:
        required: false
  workflow_dispatch:
    inputs:
      pair_mode:
        description: Candidate server, package-selected immutable server, or both
        type: choice
        options: [candidate, selected, both]
        default: selected
  pull_request:
    paths:
      - "MCPForUnity/package.json"
      - "manifest.json"
      - "release-source-inputs.json"
      - "MCPForUnity/Editor/**"
      - "MCPForUnity/Runtime/**"
      - "Server/src/**"
      - "Server/pyproject.toml"
      - "Server/uv.lock"
      - "Server/tests/e2e/**"
      - "tools/local_harness.py"
      - "tools/bridge_pair_evidence.py"
      - "tools/check_source_pin_drift.py"
      - "tools/check_release_evidence.py"
      - "tools/tests/test_bridge_pair_evidence.py"
      - "tools/ci_unity_license.py"
      - "tools/unity_ci_packages.py"
      - "tools/unity_ci_package_cache.py"
      - "tools/unity-ci-packages.json"
      - "tools/unity-registry-pins.json"
      - "tools/unity-versions.json"
      - "tools/unity-ci/**"
      - "tools/tests/test_unity_ci_packages.py"
      - "tools/tests/test_fork_workflows.py"
      - "tools/tests/test_ci_unity_license.py"
      - ".github/workflows/e2e-bridge.yml"

permissions:
  contents: read

concurrency:
  group: e2e-bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UNITY_IMAGE: unityci/editor:ubuntu-2021.3.45f2-linux-il2cpp-3@sha256:903ced48a1d4f415b597280b76c4f01f1bd38f66c654805fb3ffd16874d7d2ee

jobs:
  pairs:
    name: Identify bridge component pairs
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pairs.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact bridge package revision
        env:
          EXPECTED_SHA: ${{ inputs.ref || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Plan bounded bridge coverage
        id: pairs
        env:
          PAIR_SELECTION: ${{ inputs.pair_mode || 'auto' }}
          BASELINE_REVISION: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--selection "$PAIR_SELECTION")
          if [[ -n "$BASELINE_REVISION" ]]; then
            args+=(--baseline "$BASELINE_REVISION")
          fi
          python3 tools/bridge_pair_evidence.py plan "${args[@]}" \
            --report reports/bridge-pair-plan.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Preserve bridge pair plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-bridge-pair-plan
          path: reports/bridge-pair-plan.json
          retention-days: 14

  license:
    # Hoisted out of the smoke job so the gate is a JOB-level condition. A step-level `if:`
    # produces step-conclusion `skipped`, which contributes nothing to the job conclusion,
    # so this workflow reported a green check having booted no Editor and exercised no tool
    # call. A job skipped by a job-level `if:` reports "Skipped" in the merge box instead.
    # Branch protection treats a skipped required check as satisfied, so merges are not blocked.
    name: Check Unity runtime test policy
    runs-on: ubuntu-26.04
    permissions: {}
    outputs:
      unity_ok: ${{ steps.detect.outputs.unity_ok || 'false' }}
    steps:
      - name: Report license-free validation
        id: license-free
        if: vars.UNITY_RUN_LICENSED_TESTS != 'true'
        run: |
          {
            echo "## License-free validation"
            echo
            echo "Live E2E bridge tests are **SKIPPED** because licensed Editor execution is disabled."
            echo "No Unity activation or Editor test execution was attempted."
            echo "Python tests and license-free compilation remain independent checks."
            echo "A skipped live suite is not evidence that real Editor tool calls passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detect Unity license secrets
        id: detect
        if: vars.UNITY_RUN_LICENSED_TESTS == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -e
          # Only absent secrets skip a fork run. Partial configuration must fail
          # explicitly in prepare, rather than silently look like missing access.
          if [ -n "$UNITY_LICENSE$UNITY_EMAIL$UNITY_PASSWORD$UNITY_SERIAL" ]; then
            echo "unity_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "unity_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E bridge smoke SKIPPED - no license secrets in scope (normal for fork PRs). This check is NOT a pass: nothing was booted or exercised."
            # The dependent job is gated on this output, so it reports Skipped rather
            # than a green check. Still say plainly on the run page what did not happen.
            {
              echo "## :warning: E2E bridge smoke was SKIPPED"
              echo
              echo "No Unity license secrets were in scope, so **no Editor was booted and no tool call was exercised**."
              echo "The dependent job reports **Skipped** - it did not pass, it did not run."
              echo
              echo "GitHub withholds repository secrets from workflow runs triggered by a fork's pull request."
            } >> "$GITHUB_STEP_SUMMARY"
          fi


  e2e-bridge:
    runs-on: ubuntu-26.04
    needs: [license, pairs]
    if: needs.license.outputs.unity_ok == 'true'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.pairs.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact bridge package revision
        env:
          EXPECTED_SHA: ${{ inputs.ref || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.14"
          enable-cache: false

      - name: Prepare version-specific test packages
        id: packages
        run: |
          set -euo pipefail
          python3 tools/unity_ci_packages.py prepare \
            --unity-version 2021.3.45f2 --image "$UNITY_IMAGE" \
            --output .unity-ci/e2e-bridge

      - name: Select prepared Unity project
        id: project
        env:
          PREPARED_PROJECT: ${{ steps.packages.outputs.project_path }}
        run: |
          set -euo pipefail
          echo "UNITY_PROJECT_ROOT=$GITHUB_WORKSPACE/$PREPARED_PROJECT" >> "$GITHUB_ENV"

      - name: Install MCP server
        env:
          PAIR_MODE: ${{ matrix.mode }}
          SERVER_SOURCE: ${{ matrix.server_source }}
        run: |
          set -eux
          uv venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          if [ "$PAIR_MODE" = selected ]; then
            uv pip install "$SERVER_SOURCE"
            echo "UNITY_MCP_BRIDGE_SERVER_MODE=installed" >> "$GITHUB_ENV"
            UNITY_MCP_BRIDGE_SERVER_MODE=installed .venv/bin/python tools/bridge_pair_evidence.py verify-installed \
              --mode selected --report reports/bridge-installation.json
          else
            uv pip install -e Server
          fi

      # Activate with the same pinned GameCI implementation that runs our tests.
      # Personal account credentials do not require a professional serial key.
      - name: Prepare Unity license and activation helpers
        id: prepare_license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: python3 tools/ci_unity_license.py prepare

      - name: Activate Unity license
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: python3 tools/ci_unity_license.py activate

      - name: Warm up project (import Library once)
        shell: bash
        env:
          UNITY_IMAGE: ${{ env.UNITY_IMAGE }}
        run: |
          set -euxo pipefail
          docker run --rm --network host \
            -e HOME=/root \
            -v "$RUNNER_TEMP/unity-machine-id:/etc/machine-id:ro" \
            -v "${{ github.workspace }}:${{ github.workspace }}" -w "${{ github.workspace }}" \
            -v "$RUNNER_TEMP/unity-config:/root/.config/unity3d" \
            -v "$RUNNER_TEMP/unity-local:/root/.local/share/unity3d" \
            -v "$RUNNER_TEMP/unity-cache:/root/.cache/unity3d" \
            "$UNITY_IMAGE" /opt/unity/Editor/Unity -batchmode -nographics -logFile - \
              -projectPath "$UNITY_PROJECT_ROOT" \
              -quit

      - name: Clean old MCP status
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/.unity-mcp"
          rm -f "$GITHUB_WORKSPACE/.unity-mcp"/unity-mcp-status-*.json || true

      - name: Run headless bridge harness (boot + wait + smoke/editmode/playmode)
        id: harness
        shell: bash
        env:
          UNITY_IMAGE: ${{ env.UNITY_IMAGE }}
          REQUIRE_NATIVE: ${{ inputs.require_native }}
        run: |
          set -euxo pipefail
          # In --ci mode the harness drives the DockerLauncher: it runs the same
          # docker container (repo .unity-mcp status dir, docker liveness/teardown,
          # log redaction), waits on the status file, derives the instance, then
          # runs the smoke + EditMode + PlayMode legs over the bridge.
          args=()
          if [ "$REQUIRE_NATIVE" = true ]; then
            args+=(--strict-playmode)
          fi
          python3 tools/local_harness.py --ci \
            --legs smoke,editmode,playmode \
            --project-path "$UNITY_PROJECT_ROOT" \
            --reports reports "${args[@]}"

      - name: Record bridge pair outcome
        if: always()
        env:
          PAIR_MODE: ${{ matrix.mode }}
          BRIDGE_OUTCOME: ${{ steps.harness.outcome }}
        run: |
          python3 tools/bridge_pair_evidence.py report --mode "$PAIR_MODE" \
            --outcome "${BRIDGE_OUTCOME:-skipped}" --installation reports/bridge-installation.json \
            --report reports/bridge-pair.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Return Unity license seat
        if: always() && steps.prepare_license.outcome == 'success'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: python3 tools/ci_unity_license.py return

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-bridge-report-${{ matrix.mode }}
          # The harness snapshots redacted Editor logs before removing its container.
          path: |
            reports/junit-*.xml
            reports/unity-editor-*.log
            reports/bridge-pair.json
            reports/bridge-installation.json
          if-no-files-found: ignore

  required:
    name: Require actual bridge execution
    needs: [license, pairs, e2e-bridge]
    if: always() && inputs.require_native
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os

          results = json.loads(os.environ['JOB_RESULTS'])
          required = ('license', 'pairs', 'e2e-bridge')
          if any(results.get(name, {}).get('result') != 'success' for name in required):
              raise SystemExit('Required bridge evidence is missing, skipped or failed; release qualification failed.')
