name: Credential assurance

on:
  pull_request:
    branches: [main, beta]
    paths:
      - MCPForUnity/Editor/Security/SecureKeyStore/**
      - tools/tests/fixtures/encrypted_key_store/**
      - tools/tests/fixtures/key_store_process/**
      - tools/tests/test_credential_workflow.py
      - .github/workflows/credential-assurance.yml
  push:
    branches: [beta]
    paths:
      - MCPForUnity/Editor/Security/SecureKeyStore/**
      - tools/tests/fixtures/encrypted_key_store/**
      - tools/tests/fixtures/key_store_process/**
      - tools/tests/test_credential_workflow.py
      - .github/workflows/credential-assurance.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  conformance:
    name: Synthetic credential stores (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-26.04, macos-26-intel]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.100
          skip-lts-prepass: true
      - name: Verify immutable derivation material and complete ciphertext
        run: "& ./tools/tests/fixtures/encrypted_key_store/RunRegression.ps1 -OutputRoot '${{ runner.temp }}/encrypted-key-store'"
      - name: Verify process ownership and removal failure contracts
        run: "& ./tools/tests/fixtures/key_store_process/RunRegression.ps1 -OutputRoot '${{ runner.temp }}/key-store-process'"
