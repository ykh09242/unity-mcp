name: Docs — Build & Deploy

# Builds /website and deploys the owned repositories on beta pushes or manual
# dispatch. The fork site is https://ykh09242.github.io/unity-mcp/.
#
# PR runs only build (no deploy) as a preview-validation step.
# Re-deploys also fire when the Python tool/resource registry changes,
# so M3's auto-generated reference pages stay fresh.

on:
  push:
    branches: [beta]
    paths:
      - website/**
      - docs/**
      - Server/src/services/tools/**
      - Server/src/services/resources/**
      - Server/src/services/registry/**
      - .github/workflows/docs-deploy.yml
  pull_request:
    branches: [beta, main]
    paths:
      - website/**
      - docs/**
      - Server/src/services/tools/**
      - Server/src/services/resources/**
      - Server/src/services/registry/**
      - .github/workflows/docs-deploy.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so Docusaurus's showLastUpdateTime / showLastUpdateAuthor
          # can resolve real per-file commit metadata. Shallow clones make every
          # page report the latest commit instead.
          fetch-depth: 0
          # No push back from this workflow — the deploy uses the Pages
          # OIDC token issued by actions/deploy-pages, not the repo token.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Setup npm
        run: npm install --global "$(node -p 'require("./website/package.json").packageManager')"

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Setup Pages
        id: pages
        if: >-
          (github.repository == 'CoplayDev/unity-mcp' || github.repository == 'ykh09242/unity-mcp') &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/beta'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Build
        working-directory: website
        env:
          # Static SSR does not need Node's experimental, file-backed Web Storage.
          NODE_OPTIONS: --no-experimental-webstorage
          WEBSITE_URL: ${{ steps.pages.outputs.origin }}
          # Inject the cookieless GoatCounter beacon when provisioned. The site
          # gates on process.env.GOATCOUNTER_CODE, which Actions does NOT
          # auto-expose — the Actions variable must be mapped in explicitly.
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: npm run build

      - name: Upload Pages artifact
        if: >-
          (github.repository == 'CoplayDev/unity-mcp' || github.repository == 'ykh09242/unity-mcp') &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/beta'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    permissions:
      pages: write
      id-token: write
    if: >-
      (github.repository == 'CoplayDev/unity-mcp' || github.repository == 'ykh09242/unity-mcp') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        env:
          # The pinned action still imports node:punycode; keep all other diagnostics visible.
          NODE_OPTIONS: --disable-warning=DEP0040
