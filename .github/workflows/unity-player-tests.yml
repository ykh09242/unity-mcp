name: Windows Player Assurance

on:
  workflow_dispatch:
    inputs:
      backend:
        description: "Windows Player scripting backend; IL2CPP installs its pinned optional module."
        type: choice
        options: [mono, il2cpp]
        default: mono
      player_profile:
        description: "Required Player verification scope. Long includes 1000 same-process iterations."
        type: choice
        options: [quick, standard, long]
        default: standard
      require_player_e2e:
        description: "Fail unless actual Windows Mono Player evidence completes."
        type: boolean
        default: false
      produce_prefab_pair:
        description: Build both reviewed prefab controls and package their complete source and native transfer
        type: boolean
        default: false
      native_control:
        description: Run an additional change on the installed Windows Mono Player
        type: choice
        options: [none, project-states, scene-index, enum-value, shader-variant, addressables]
        default: none
  workflow_call:
    inputs:
      backend:
        type: string
        required: false
        default: mono
      player_profile:
        type: string
        required: false
        default: standard
      require_player_e2e:
        type: boolean
        required: false
        default: false
      ref:
        type: string
        required: false
        default: ""
    secrets:
      UNITY_EMAIL:
        required: false
      UNITY_PASSWORD:
        required: false
      UNITY_SERIAL:
        required: false

permissions:
  contents: read

env:
  PLAYER_PROFILE: ${{ inputs.player_profile || 'standard' }}
  PLAYER_BACKEND: ${{ inputs.backend || 'mono' }}
  NATIVE_CONTROL: ${{ inputs.native_control || 'none' }}

jobs:
  license:
    name: Check Windows Player execution policy
    runs-on: ubuntu-26.04
    permissions: {}
    outputs:
      unity_ok: ${{ steps.detect.outputs.unity_ok || 'false' }}
    steps:
      - name: Detect scoped Windows serial prerequisites
        id: detect
        if: vars.UNITY_RUN_LICENSED_TESTS == 'true'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && [ -n "$UNITY_SERIAL" ]; then
            echo "unity_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "unity_ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain skipped execution
        if: vars.UNITY_RUN_LICENSED_TESTS != 'true' || steps.detect.outputs.unity_ok != 'true'
        run: |
          echo 'Actual Windows Player execution is SKIPPED: licensed execution policy or Windows serial prerequisites are unavailable.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A skipped job provides no native Player assurance. Linux ULF availability does not establish Windows serial activation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Validate requested Player profile
        run: |
          case "$PLAYER_BACKEND" in
            mono|il2cpp) ;;
            *) echo '::error::Unknown Windows scripting backend.'; exit 1 ;;
          esac
          case "$PLAYER_PROFILE" in
            quick|standard|long) ;;
            *) echo '::error::Unknown Player verification profile.'; exit 1 ;;
          esac
      - name: Require Windows Player prerequisites
        if: inputs.require_player_e2e || inputs.produce_prefab_pair || env.NATIVE_CONTROL != 'none'
        env:
          POLICY: ${{ vars.UNITY_RUN_LICENSED_TESTS }}
          AVAILABLE: ${{ steps.detect.outputs.unity_ok || 'false' }}
        run: |
          if [ "$POLICY" != 'true' ] || [ "$AVAILABLE" != 'true' ]; then
            echo '::error::Required Windows Player assurance needs enabled execution policy and scoped serial/email/password credentials.'
            exit 1
          fi
          if [ "${NATIVE_CONTROL:-none}" != 'none' ] && [ "${PLAYER_BACKEND:-mono}" != 'mono' ]; then
            echo '::error::The selected change control builds Windows Mono Players.'
            exit 1
          fi

  player:
    name: Actual Windows ${{ inputs.backend || 'mono' }} build and Player cases (${{ inputs.player_profile || 'standard' }})
    needs: license
    if: needs.license.outputs.unity_ok == 'true'
    runs-on: windows-2022
    timeout-minutes: ${{ (inputs.produce_prefab_pair || (inputs.native_control && inputs.native_control != 'none')) && 180 || 100 }}
    concurrency:
      group: unity-windows-player-license-${{ github.repository }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve committed source bytes for paired builds
        if: inputs.produce_prefab_pair
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Verify beta push commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta' && github.repository != 'CoplayDev/unity-mcp'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Record checked candidate
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "$CANDIDATE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            test "$actual" = "$CANDIDATE_REF"
          fi
          printf 'Checked candidate: `%s` (requested `%s`)\n' "$actual" "$CANDIDATE_REF" >> "$GITHUB_STEP_SUMMARY"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.11"
          enable-cache: false
      - name: Install locked CLI environment
        run: |
          uv sync --project Server --locked
          if ($LASTEXITCODE -ne 0) { throw 'Locked CLI environment failed' }
          "SOURCE_REVISION=$(git rev-parse HEAD)" >> $env:GITHUB_ENV
          "UNITY_INSTALL_ROOT=$env:RUNNER_TEMP\unity-player-6000.0.69f1" >> $env:GITHUB_ENV
      - name: Initialize fresh evidence
        id: initialize
        run: |
          $session = uv run --project Server python tools/run_play_scenario_player_e2e.py --initialize --profile $env:PLAYER_PROFILE --output .unity-ci/player-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Fresh evidence initialization failed' }
          "session_id=$session" >> $env:GITHUB_OUTPUT
      - name: Resolve bounded profile retention
        id: profile
        run: |
          $profileJson = uv run --project Server python tools/player_e2e_profiles.py $env:PLAYER_PROFILE
          if ($LASTEXITCODE -ne 0) { throw 'Player profile configuration failed' }
          $profile = $profileJson | ConvertFrom-Json
          "name=$($profile.name)" >> $env:GITHUB_OUTPUT
          "retention_days=$($profile.artifact_retention_days)" >> $env:GITHUB_OUTPUT
      - name: Verify and install official pinned Windows Editor
        run: |
          uv run --project Server python tools/unity_windows_ci.py provision $env:UNITY_INSTALL_ROOT --backend $env:PLAYER_BACKEND
          if ($LASTEXITCODE -ne 0) { throw 'Verified Windows Editor installation failed' }
      - name: Activate scoped Windows serial license
        id: activate
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          uv run --project Server python tools/unity_windows_ci.py activate "$env:UNITY_INSTALL_ROOT\installed\Editor\Unity.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Private Windows activation failed' }
      - name: Prepare dedicated synthetic fixture project
        run: |
          uv run --project Server python tools/unity_ci_packages.py prepare --unity-version 6000.0.69f1 --unity-data "$env:UNITY_INSTALL_ROOT\installed\Editor\Data" --output .unity-ci/player-project
          if ($LASTEXITCODE -ne 0) { throw 'Dedicated fixture package preparation failed' }
      - name: Build and execute actual Player bodies
        id: execute
        env:
          SESSION_ID: ${{ steps.initialize.outputs.session_id }}
        run: |
          uv run --project Server python tools/run_play_scenario_player_e2e.py --editor "$env:UNITY_INSTALL_ROOT\installed\Editor\Unity.exe" --project .unity-ci/player-project/project --output .unity-ci/player-evidence --session-id $env:SESSION_ID --source-revision $env:SOURCE_REVISION --profile $env:PLAYER_PROFILE --backend $env:PLAYER_BACKEND
          if ($LASTEXITCODE -ne 0) { throw 'Actual Player execution or body assertions failed' }
      - name: Independently check required persisted evidence
        id: evidence
        if: always()
        env:
          SESSION_ID: ${{ steps.initialize.outputs.session_id }}
          RUNNER_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          uv run --project Server python tools/check_play_scenario_player_evidence.py .unity-ci/player-evidence --session-id $env:SESSION_ID --profile $env:PLAYER_PROFILE --backend $env:PLAYER_BACKEND
          if ($LASTEXITCODE -ne 0) { throw 'Fresh required Player evidence failed independent verification' }
          if ($env:RUNNER_OUTCOME -ne 'success') { throw 'Actual Player runner did not succeed' }
      - name: Observe target compiler inputs and importer-only Player rendering
        if: env.PLAYER_PROFILE == 'long' && env.PLAYER_BACKEND == 'mono'
        run: |
          uv run --project Server python tools/unity_ci_packages.py prepare --unity-version 6000.0.69f1 --unity-data "$env:UNITY_INSTALL_ROOT\installed\Editor\Data" --output .unity-ci/configuration-project
          if ($LASTEXITCODE) { throw 'Could not prepare isolated configuration controls' }
          uv run --project Server python TestProjects/UnityMCPTests/Verification/run_configuration_controls.py --editor "$env:UNITY_INSTALL_ROOT\installed\Editor\Unity.exe" --project .unity-ci/configuration-project/project --output .unity-ci/configuration-observations
          if ($LASTEXITCODE) { throw 'Configuration controls lack the required compiler or rendered Player evidence' }
      - name: Build and observe the selected change
        id: native_control
        if: env.NATIVE_CONTROL != 'none'
        run: |
          $editor = Join-Path $env:UNITY_INSTALL_ROOT 'installed/Editor/Unity.exe'
          $version = (Get-Content tools/unity-player-e2e.json -Raw | ConvertFrom-Json).unity_version
          $output = '.unity-ci/change-observations'
          if ($env:NATIVE_CONTROL -eq 'project-states') {
            uv run --project Server --locked python TestProjects/VerificationProjects/run_projects.py --editor $editor --output $output
            if ($LASTEXITCODE) { throw 'Independent project states did not match their own expectations.' }
            uv run --project Server --locked python TestProjects/VerificationProjects/run_load_branches.py --control-directory $output
            exit $LASTEXITCODE
          }
          if ($env:NATIVE_CONTROL -eq 'addressables') {
            uv run --project Server --locked python tools/run_addressables_content_update.py --editor $editor --unity-version $version --output $output
            exit $LASTEXITCODE
          }
          $driver = switch ($env:NATIVE_CONTROL) {
            'scene-index' { 'TestProjects/UnityMCPTests/Verification/run_scene_index_control.py' }
            'enum-value' { 'TestProjects/UnityMCPTests/Verification/run_enum_value_control.py' }
            'shader-variant' { 'tools/run_shader_variant_pair.py' }
            default { throw 'Unrecognized change control.' }
          }
          uv run --project Server --locked python tools/unity_ci_packages.py prepare --unity-version $version --unity-data "$env:UNITY_INSTALL_ROOT/installed/Editor/Data" --output .unity-ci/change-project
          if ($LASTEXITCODE) { throw 'Could not prepare the isolated change project.' }
          uv run --project Server --locked python $driver --editor $editor --project .unity-ci/change-project/project --output $output
          exit $LASTEXITCODE
      - name: Retain change observations and execution logs
        if: always() && (steps.native_control.outcome == 'success' || steps.native_control.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ env.NATIVE_CONTROL }}-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            .unity-ci/change-observations/*.json
            .unity-ci/change-observations/*.log
            .unity-ci/change-observations/*/*.json
            .unity-ci/change-observations/*/*.log
            .unity-ci/change-observations/*/frame.png
            .unity-ci/change-observations/*/editor-process/*.log
            .unity-ci/change-observations/*/editor-process/launch.json
            .unity-ci/change-observations/*/player-process/*.log
            .unity-ci/change-observations/*/player-process/launch.json
            .unity-ci/change-observations/*/runs/*/*.json
            .unity-ci/change-observations/*/runs/*/player.log
            .unity-ci/change-observations/*/editor-reference/observation.json
            .unity-ci/change-observations/*/editor-reference/frame.png
            .unity-ci/change-observations/*/capture/**
            .unity-ci/change-observations/before/Assets/**
            .unity-ci/change-observations/after/Assets/**
            .unity-ci/change-observations/repaired/Assets/**
            .unity-ci/change-observations/*/ProjectSettings/EditorBuildSettings.asset
            .unity-ci/change-observations/load-branches/runs/*/*.json
            .unity-ci/change-observations/load-branches/runs/*/player.log
      - name: Build and capture the maintained moved and repaired prefab Players
        if: inputs.produce_prefab_pair && github.repository == 'ykh09242/unity-mcp' && github.ref == 'refs/heads/beta'
        env:
          PYTHONPATH: ${{ github.workspace }}/Server/src
        run: |
          $receipt = uv run --project Server --locked python TestProjects/UnityMCPTests/Verification/build_reviewed_prefab_pair.py --editor "$env:UNITY_INSTALL_ROOT/installed/Editor/Unity.exe" --output "$env:RUNNER_TEMP/prefab-builder"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $receipt >> $env:GITHUB_STEP_SUMMARY
      - name: Upload complete candidate transfer for independent approval
        if: inputs.produce_prefab_pair && github.repository == 'ykh09242/unity-mcp' && github.ref == 'refs/heads/beta'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilt-player-pair
          path: ${{ runner.temp }}/prefab-builder/transfer
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
      - name: Return owned Windows license
        if: always() && steps.activate.outcome != 'skipped'
        run: |
          if (Test-Path -LiteralPath "$env:UNITY_INSTALL_ROOT\installed\Editor\Unity.exe") {
            uv run --project Server python tools/unity_windows_ci.py return "$env:UNITY_INSTALL_ROOT\installed\Editor\Unity.exe"
            if ($LASTEXITCODE -ne 0) { throw 'Windows license return failed' }
          }
      - name: Retain actual Player evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ inputs.backend || 'mono' }}-player-evidence-${{ steps.profile.outputs.name || 'unknown' }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: ${{ steps.profile.outputs.retention_days || 14 }}
          path: |
            .unity-ci/player-evidence/**
            .unity-ci/player-project/resolved-packages.json
            .unity-ci/configuration-observations/comparison.json
            .unity-ci/configuration-observations/*/*.json
            .unity-ci/configuration-observations/*/runs/*/*.json
            .unity-ci/configuration-observations/*/runs/*/player.log
            .unity-ci/configuration-observations/*/editor-process/process.log
            ${{ runner.temp }}/unity-player-6000.0.69f1/provision.json
            ${{ runner.temp }}/unity-player-6000.0.69f1/module-provision.json
            ${{ runner.temp }}/unity-player-6000.0.69f1/module-install-evidence/**
            ${{ runner.temp }}/unity-player-6000.0.69f1/install-evidence/**

  requiredPlayerE2E:
    name: Required actual Windows Player assurance
    needs: [license, player]
    if: always() && inputs.require_player_e2e
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Require actual licensed execution and evidence
        env:
          LICENSE_RESULT: ${{ needs.license.result }}
          UNITY_OK: ${{ needs.license.outputs.unity_ok }}
          PLAYER_RESULT: ${{ needs.player.result }}
        run: |
          if [ "$LICENSE_RESULT" != 'success' ] || [ "$UNITY_OK" != 'true' ] || [ "$PLAYER_RESULT" != 'success' ]; then
            echo '::error::Required Windows Player assurance did not complete its actual builds, process bodies and fresh evidence.'
            exit 1
          fi
