name: Python Tests

on:
  push:
    # Exclude beta and main: those branches re-trigger this workflow via
    # workflow_call from beta-release.yml / release.yml. Without the exclusion,
    # a push to beta that touches Server/** fires this workflow twice for the
    # same SHA, and GitHub auto-cancels the duplicate.
    branches-ignore: [beta, main]
    paths:
      - Server/**
      - tools/**
      - mcp_source.py
      - .github/scripts/**
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
      - manifest.json
      - unity-mcp-skill/**
      - .claude/skills/**
  pull_request:
    branches: [main, beta]
    paths:
      - Server/**
      - tools/**
      - mcp_source.py
      - .github/scripts/**
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
      - manifest.json
      - unity-mcp-skill/**
      - .claude/skills/**
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (defaults to the triggering ref)."
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  server_bootstrap:
    name: Server Bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout source metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
          sparse-checkout: |
            MCPForUnity/package.json
            tools/check_server_startup.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          python-version: "3.11"
          enable-cache: false

      - name: Verify cold and offline server bootstrap
        shell: pwsh
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/unity-mcp-bootstrap-cache
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: "false"
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Get-Content -LiteralPath MCPForUnity/package.json -Raw | ConvertFrom-Json).mcpServerSource
          if ($source -cnotmatch '^https://github\.com/ykh09242/unity-mcp/archive/[0-9a-f]{40}\.zip#subdirectory=Server$') {
            throw 'The default server source must be a full-commit fork archive'
          }
          $cold = & uvx --no-config --no-progress --no-env-file --python 3.11 --from $source mcp-for-unity --help
          if ($LASTEXITCODE -ne 0) { throw 'Cold server bootstrap failed' }
          if (($cold -join "`n") -notmatch 'Unity MCP \(ykh09242\)') { throw 'Server help was not rendered' }
          & uvx --no-config --no-progress --no-env-file --python 3.11 --from $source python tools/check_server_startup.py
          if ($LASTEXITCODE -ne 0) { throw 'Cold server registration failed' }
          $offline = & uvx --no-config --no-progress --no-env-file --offline --python 3.11 --from $source mcp-for-unity --help
          if ($LASTEXITCODE -ne 0) { throw 'Offline server bootstrap failed' }
          if (($offline -join "`n") -notmatch 'Unity MCP \(ykh09242\)') { throw 'Offline help was not rendered' }
          & uvx --no-config --no-progress --no-env-file --offline --python 3.11 --from $source python tools/check_server_startup.py
          if ($LASTEXITCODE -ne 0) { throw 'Offline server registration failed' }
          if (Test-Path -LiteralPath (Join-Path $env:UV_CACHE_DIR 'git-v0')) { throw 'Server bootstrap unexpectedly used Git checkout' }
          Write-Output 'Cold and offline bootstrap and registration passed without Git checkout or a server listener.'

  test:
    name: Run Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep the declared support floor alongside the latest stable interpreter.
        python-version: ["3.11", "3.14.8"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Set up Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Verify unlocked candidate startup
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/unity-mcp-candidate-cache
        run: |
          uvx --no-config --no-progress --no-env-file --python "${{ matrix.python-version }}" --from ./Server python tools/check_server_startup.py

      - name: Install dependencies
        run: |
          cd Server
          # --locked fails if uv.lock disagrees with pyproject.toml instead of silently
          # re-resolving, so a dependency or version bump that forgot `uv lock` shows up here.
          # The dev extra is resolved in the lock too, so pytest runs against pinned versions
          # instead of whatever `uv pip install` would fetch today.
          uv sync --python "${{ matrix.python-version }}" --locked --extra dev

      - name: Run Pylint
        # One interpreter is enough for static analysis; tests retain the full matrix.
        if: matrix.python-version != '3.11'
        run: |
          cd Server
          uv run --python "${{ matrix.python-version }}" --locked --extra dev python ../tools/lint_python.py

      - name: Run tests with coverage
        run: |
          cd Server
          uv run --python "${{ matrix.python-version }}" pytest tests/ -v -W error --tb=short --cov --cov-report=xml --cov-report=html --cov-report=term

      - name: Run local harness unit tests (hermetic, no Unity)
        run: |
          cd Server
          uv run --python "${{ matrix.python-version }}" python -m pytest "$GITHUB_WORKSPACE/tools/tests/" -v -W error --tb=short

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        # Forks retain coverage artifacts without requiring Codecov credentials.
        if: always() && github.repository == 'CoplayDev/unity-mcp'
        # Upload/download outages must not fail the successful test gate.
        continue-on-error: true
        with:
          files: ./Server/coverage.xml
          flags: python
          name: python-coverage-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: |
            Server/.pytest_cache/
            Server/tests/
            Server/coverage.xml
            Server/htmlcov/
