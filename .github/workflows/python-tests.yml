name: Python Tests

on:
  pull_request:
    branches: [main, beta]
    paths:
      - .dockerignore
      - docker-compose.yml
      - docker-compose.remote.yml
      - Server/**
      - MCPForUnity/**
      # Shared corpus consumed by Server/tests/test_play_scenario_shared_contract.py.
      - TestProjects/UnityMCPTests/Assets/Tests/EditMode/Tools/PlayScenarios/Fixtures/shared-report-contract.json
      - tools/**
      - mcp_source.py
      - .github/scripts/**
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
      - manifest.json
      - unity-mcp-skill/**
      - .claude/skills/**
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (defaults to the triggering ref)."
        type: string
        required: false
        default: ""
      validation_profile:
        description: "Full validation by default; tools-only is reserved for verified fork tooling changes."
        type: string
        required: false
        default: full
      defer_performance_report:
        description: "Let the caller publish timing reports outside its required-check path."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  # uv retries individual dependency HTTP requests, never builds or test commands.
  # Allow slower hosted package indexes without changing application deadlines.
  UV_HTTP_RETRIES: "5"
  UV_HTTP_CONNECT_TIMEOUT: "30"
  UV_HTTP_TIMEOUT: "60"

jobs:
  container:
    name: Candidate container (no publication)
    if: inputs.validation_profile != 'tools-only'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Verify beta push commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta' && github.repository != 'CoplayDev/unity-mcp'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Record checked candidate
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "$CANDIDATE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            test "$actual" = "$CANDIDATE_REF"
          fi
          printf 'Container candidate: `%s`\n' "$actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Select actual container inputs
        id: scope
        run: python3 tools/check_container.py scope
      - name: Build and smoke installed candidate and rejection controls
        if: steps.scope.outputs.required == 'true'
        run: python3 tools/check_container.py validate --negative-controls

  windows_hermetic:
    name: Windows hermetic process and Player file contracts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify beta push commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta' && github.repository != 'CoplayDev/unity-mcp'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Record checked candidate
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "$CANDIDATE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            test "$actual" = "$CANDIDATE_REF"
          fi
          printf 'Checked candidate: `%s` (requested `%s`)\n' "$actual" "$CANDIDATE_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.14"
          enable-cache: false
      - name: Install locked test dependencies
        working-directory: Server
        run: uv sync --python 3.14 --locked --extra dev
      - name: Execute owned synthetic process and file-sharing cases (zero skips)
        shell: pwsh
        env:
          UNITY_MCP_DISABLE_TELEMETRY: "1"
        run: |
          uv run --project Server --python 3.14 --locked --extra dev python tools/check_windows_regressions.py --output .tmp/windows-hermetic
      - name: Upload Windows regression execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-hermetic-results
          path: .tmp/windows-hermetic/results.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  reference_graph:
    name: Reference graph (${{ matrix.os }}, Python ${{ matrix.python }})
    if: inputs.validation_profile != 'tools-only'
    runs-on: ${{ matrix.os }}
    # macOS may build cryptography from source before the graph tests can start.
    timeout-minutes: ${{ startsWith(matrix.os, 'macos') && 20 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-26.04, macos-26-intel]
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify beta push commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta' && github.repository != 'CoplayDev/unity-mcp'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Record checked candidate
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "$CANDIDATE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            test "$actual" = "$CANDIDATE_REF"
          fi
          printf 'Checked candidate: `%s` (requested `%s`)\n' "$actual" "$CANDIDATE_REF" >> "$GITHUB_STEP_SUMMARY"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-suffix: reference-graph-${{ matrix.python }}
          cache-dependency-glob: |
            Server/pyproject.toml
            Server/uv.lock
      - name: Install and exercise isolated reference graph
        working-directory: Server
        env:
          PY_KEY_VALUE_DISABLE_BEARTYPE: ${{ matrix.python == '3.15' && 'true' || 'false' }}
          UNITY_MCP_LOG_DIR: ${{ runner.temp }}/reference-graph-logs
        run: |
          uv sync --python "${{ matrix.python }}" --locked --extra dev
          uv run --python "${{ matrix.python }}" --locked --extra dev python -W error -m pytest tests/test_reference_graph_native_spools.py tests/test_reference_graph_store.py tests/test_reference_graph_analysis.py tests/test_reference_graph_semantics.py tests/test_reference_graph_provenance.py tests/test_reference_graph_queries.py tests/test_reference_graph_mutations.py tests/test_reference_graph_runtime.py tests/test_reference_graph_operations.py tests/test_reference_graph_external.py tests/test_reference_graph_external_changes.py tests/test_reference_graph_workspace.py tests/test_reference_graph_policy_admission.py tests/test_reference_graph_reconcile.py tests/test_reference_graph_service.py -q -o asyncio_default_fixture_loop_scope=function --basetemp "${{ runner.temp }}/reference-graph-tests"

      - name: Verify Windows event-loop shutdown and bounded launch output
        if: runner.os == 'Windows'
        working-directory: Server
        env:
          PY_KEY_VALUE_DISABLE_BEARTYPE: ${{ matrix.python == '3.15' && 'true' || 'false' }}
          UNITY_MCP_DISABLE_TELEMETRY: "1"
          UNITY_MCP_LOG_DIR: ${{ runner.temp }}/windows-launch-logs
        run: >-
          uv run --python "${{ matrix.python }}" --locked --extra dev python -W error -m pytest
          tests/test_windows_loop_startup.py tests/test_launch_output.py
          -q -o asyncio_default_fixture_loop_scope=function -p no:cacheprovider
          --basetemp "${{ runner.temp }}/windows-launch-tests"

      - name: Verify interrupted private-store initialization
        working-directory: Server
        env:
          PY_KEY_VALUE_DISABLE_BEARTYPE: ${{ matrix.python == '3.15' && 'true' || 'false' }}
          UNITY_MCP_LOG_DIR: ${{ runner.temp }}/private-store-logs
        run: |
          uv run --python "${{ matrix.python }}" --locked --extra dev python -W error -m pytest tests/test_private_store_bootstrap.py tests/test_execution_receipts.py tests/http/test_mcp_test_wait_lifecycle.py -q -o asyncio_default_fixture_loop_scope=function --basetemp "${{ runner.temp }}/private-store-tests"

  server_bootstrap:
    name: Server Bootstrap (${{ matrix.os }})
    if: inputs.validation_profile != 'tools-only'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Use the standard Intel pool after repeated hosted arm64 capacity failures.
        os: [windows-latest, ubuntu-26.04, macos-26-intel]
    steps:
      - name: Checkout source metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            MCPForUnity/package.json
            tools/check_server_startup.py
          sparse-checkout-cone-mode: false

      - name: Verify beta push commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta' && github.repository != 'CoplayDev/unity-mcp'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Record checked candidate
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "$CANDIDATE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            test "$actual" = "$CANDIDATE_REF"
          fi
          printf 'Checked candidate: `%s` (requested `%s`)\n' "$actual" "$CANDIDATE_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.11"
          enable-cache: false

      - name: Verify cold and offline server bootstrap
        shell: pwsh
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/unity-mcp-bootstrap-cache
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: "false"
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Get-Content -LiteralPath MCPForUnity/package.json -Raw | ConvertFrom-Json).mcpServerSource
          if ($source -cnotmatch '^https://github\.com/ykh09242/unity-mcp/archive/[0-9a-f]{40}\.zip#subdirectory=Server$') {
            throw 'The default server source must be a full-commit fork archive'
          }
          $cold = & uvx --no-config --no-progress --no-env-file --python 3.11 --from $source mcp-for-unity --help
          if ($LASTEXITCODE -ne 0) { throw 'Cold server bootstrap failed' }
          if (($cold -join "`n") -notmatch 'Unity MCP \(ykh09242\)') { throw 'Server help was not rendered' }
          & uvx --no-config --no-progress --no-env-file --python 3.11 --from $source python tools/check_server_startup.py
          if ($LASTEXITCODE -ne 0) { throw 'Cold server registration failed' }
          $offline = & uvx --no-config --no-progress --no-env-file --offline --python 3.11 --from $source mcp-for-unity --help
          if ($LASTEXITCODE -ne 0) { throw 'Offline server bootstrap failed' }
          if (($offline -join "`n") -notmatch 'Unity MCP \(ykh09242\)') { throw 'Offline help was not rendered' }
          & uvx --no-config --no-progress --no-env-file --offline --python 3.11 --from $source python tools/check_server_startup.py
          if ($LASTEXITCODE -ne 0) { throw 'Offline server registration failed' }
          if (Test-Path -LiteralPath (Join-Path $env:UV_CACHE_DIR 'git-v0')) { throw 'Server bootstrap unexpectedly used Git checkout' }
          Write-Output 'Cold and offline bootstrap and registration passed without Git checkout or a server listener.'

  installed_archive:
    name: Installed candidate archive (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: inputs.validation_profile != 'tools-only'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      # Match the 3.15 suite policy for py-key-value-aio's optional instrumentation.
      PY_KEY_VALUE_DISABLE_BEARTYPE: ${{ matrix.python-version == '3.15' && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-26.04, macos-26-intel]
        python-version: ["3.11"]
        include:
          - os: ubuntu-26.04
            python-version: "3.15"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify beta push commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta' && github.repository != 'CoplayDev/unity-mcp'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Record checked candidate
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "$CANDIDATE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            test "$actual" = "$CANDIDATE_REF"
          fi
          printf 'Checked candidate: `%s` (requested `%s`)\n' "$actual" "$CANDIDATE_REF" >> "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install candidate archive without runtime lock
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/candidate-archive-cache
          ARCHIVE_PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'candidate.zip'
          $evidence = '.tmp/candidate-archive'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Candidate identity failed' }
          git archive --format=zip --output=$archive "${revision}:Server"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate archive failed' }
          $environment = Join-Path $env:RUNNER_TEMP 'candidate-environment'
          uv venv --no-config --python $env:ARCHIVE_PYTHON_VERSION $environment
          if ($LASTEXITCODE -ne 0) { throw 'Archive environment failed' }
          $python = if ($IsWindows) { Join-Path $environment 'Scripts/python.exe' } else { Join-Path $environment 'bin/python' }
          $archiveDigest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $source = 'ykh09242-unity-mcp-server @ ' + ([System.Uri]::new($archive)).AbsoluteUri + '#sha256=' + $archiveDigest
          @{ candidate_sha = $revision; archive_sha256 = $archiveDigest; python_version = $env:ARCHIVE_PYTHON_VERSION } | ConvertTo-Json | Set-Content -LiteralPath "$evidence/source.json"
          uv --version > "$evidence/toolchain.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Archive uv identity failed' }
          & $python -I -c 'import platform, sys; print(sys.version); print(sys.executable); print(platform.platform())' >> "$evidence/toolchain.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Archive interpreter identity failed' }
          uv pip install --no-config --python $python $source 2>&1 | Tee-Object -FilePath "$evidence/install.log"
          if ($LASTEXITCODE -ne 0) { throw 'Unlocked candidate archive installation failed' }
          uv pip freeze --no-config --python $python > "$evidence/resolved.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Archive resolution evidence failed' }
          "ARCHIVE_PYTHON=$python" >> $env:GITHUB_ENV
          "ARCHIVE_CANDIDATE_SHA=$revision" >> $env:GITHUB_ENV
          "ARCHIVE_FILE=$archive" >> $env:GITHUB_ENV
      - name: Exercise installed MCP, HTTP and CLI behavior
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:ARCHIVE_PYTHON -I -W error "$env:GITHUB_WORKSPACE/tools/check_server_archive.py" --forbid-source $env:GITHUB_WORKSPACE --candidate-sha $env:ARCHIVE_CANDIDATE_SHA --archive-file $env:ARCHIVE_FILE > .tmp/candidate-archive/behavior.json 2> .tmp/candidate-archive/behavior.stderr.log
          if ($LASTEXITCODE -ne 0) { throw 'Installed public behavior failed' }
          & $env:ARCHIVE_PYTHON -I -W error "$env:GITHUB_WORKSPACE/tools/check_server_startup.py" > .tmp/candidate-archive/registration.jsonl 2> .tmp/candidate-archive/registration.stderr.log
          if ($LASTEXITCODE -ne 0) { throw 'Installed archive registration failed' }
          Get-Content .tmp/candidate-archive/behavior.json
          Get-Content .tmp/candidate-archive/registration.jsonl

      - name: Retain candidate source, resolution and probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-archive-${{ matrix.os }}-python-${{ matrix.python-version }}-${{ github.run_id }}
          path: .tmp/candidate-archive/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  test:
    name: Run Python ${{ matrix.suite }} tests (${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      # py-key-value-aio 0.4.6 inherits a runtime-checkable protocol without
      # redecorating it, deprecated in Python 3.15. Disable only its optional
      # beartype instrumentation; keep application validation and -W error.
      PY_KEY_VALUE_DISABLE_BEARTYPE: ${{ matrix.python-version == '3.15' && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        # Unknown/default profiles retain both complete suites on every supported minor.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        suite: ${{ fromJSON(inputs.validation_profile == 'tools-only' && '["tools"]' || '["server","tools"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Verify beta push commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta' && github.repository != 'CoplayDev/unity-mcp'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Record checked candidate
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "$CANDIDATE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            test "$actual" = "$CANDIDATE_REF"
          fi
          printf 'Checked candidate: `%s` (requested `%s`)\n' "$actual" "$CANDIDATE_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: python-${{ matrix.python-version }}
          cache-dependency-glob: |
            Server/pyproject.toml
            Server/uv.lock
          # One writer per interpreter avoids duplicate uploads from parallel suites.
          save-cache: ${{ matrix.suite == 'tools' }}

      - name: Set up Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Verify unlocked candidate startup
        if: matrix.suite == 'server'
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/unity-mcp-candidate-cache
        run: |
          uvx --no-config --no-progress --no-env-file --python "${{ matrix.python-version }}" --from ./Server python tools/check_server_startup.py

      - name: Install dependencies
        run: |
          cd Server
          # --locked fails if uv.lock disagrees with pyproject.toml instead of silently
          # re-resolving, so a dependency or version bump that forgot `uv lock` shows up here.
          # The dev extra is resolved in the lock too, so pytest runs against pinned versions
          # instead of whatever `uv pip install` would fetch today.
          uv sync --python "${{ matrix.python-version }}" --locked --extra dev

      - name: Set up managed harness SDK
        if: matrix.suite == 'tools' && matrix.python-version == '3.15'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.100
          skip-lts-prepass: true

      - name: Prepare verified managed harness reference
        if: matrix.suite == 'tools' && matrix.python-version == '3.15'
        run: uv run --directory Server --locked --extra dev python ../tools/prepare_managed_test_refs.py --output ../.compile-refs/nunit.framework.dll

      - name: Require production deadline ownership assertions
        if: matrix.suite == 'tools' && matrix.python-version == '3.15'
        env:
          UNITY_MCP_REQUIRE_DEADLINE_HARNESS: '1'
        run: uv run --directory Server --locked --extra dev python -m pytest ../tools/tests/test_websocket_deadline_ownership.py -q -W error -o asyncio_default_fixture_loop_scope=function

      - name: Run Pylint
        # Keep static analysis off the longer server-test path and run it once.
        if: matrix.suite == 'tools' && matrix.python-version == '3.15'
        run: |
          cd Server
          uv run --python "${{ matrix.python-version }}" --locked --extra dev python ../tools/lint_python.py

      - name: Run tests with coverage [test:${{ matrix.python-version }}:${{ matrix.suite }}]
        if: matrix.suite == 'server' && matrix.python-version == '3.14'
        env:
          UNITY_MCP_LOG_DIR: ${{ runner.temp }}/unity-mcp-test-logs
          PYTHONPATH: ${{ github.workspace }}/tools
          EVIDENCE_STEP_NAME: Run tests with coverage [test:${{ matrix.python-version }}:${{ matrix.suite }}]
        run: |
          cd Server
          # Start the measured long HTTP child early; keep complete files on four workers.
          uv run --python "${{ matrix.python-version }}" --locked --extra dev python ../tools/release_execution.py run --kind python --step-name "$EVIDENCE_STEP_NAME" --output results=test-results.xml -- uv run --python "${{ matrix.python-version }}" pytest tests/ -n 4 --dist=loadfile --max-worker-restart=0 -p pytest_ci_schedule --no-loadscope-reorder --ci-first-file=test_http_security.py -p pytest_ci_timing --ci-timing-output=test-worker-timings.json --ci-progress-dir=test-worker-progress -q -W error --tb=short --junitxml=test-results.xml --durations=20 --cov --cov-report=xml --cov-report=html --cov-report=term

      - name: Run server tests [test:${{ matrix.python-version }}:${{ matrix.suite }}]
        if: matrix.suite == 'server' && matrix.python-version != '3.14'
        env:
          UNITY_MCP_LOG_DIR: ${{ runner.temp }}/unity-mcp-test-logs
          PYTHONPATH: ${{ github.workspace }}/tools
          EVIDENCE_STEP_NAME: Run server tests [test:${{ matrix.python-version }}:${{ matrix.suite }}]
        run: |
          cd Server
          uv run --python "${{ matrix.python-version }}" --locked --extra dev python ../tools/release_execution.py run --kind python --step-name "$EVIDENCE_STEP_NAME" --output results=test-results.xml -- uv run --python "${{ matrix.python-version }}" pytest tests/ -n 4 --dist=loadfile --max-worker-restart=0 -p pytest_ci_schedule --no-loadscope-reorder --ci-first-file=test_http_security.py -p pytest_ci_timing --ci-timing-output=test-worker-timings.json --ci-progress-dir=test-worker-progress -q -W error --tb=short --junitxml=test-results.xml --durations=20

      - name: Run local harness unit tests (hermetic, no Unity) [test:${{ matrix.python-version }}:${{ matrix.suite }}]
        if: matrix.suite == 'tools'
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
          EVIDENCE_STEP_NAME: Run local harness unit tests (hermetic, no Unity) [test:${{ matrix.python-version }}:${{ matrix.suite }}]
        run: |
          cd Server
          # This sibling suite cannot inherit Server/tests/pytest.ini.
          uv run --python "${{ matrix.python-version }}" --locked --extra dev python ../tools/release_execution.py run --kind python --step-name "$EVIDENCE_STEP_NAME" --output results=test-results.xml -- uv run --python "${{ matrix.python-version }}" python -m pytest "$GITHUB_WORKSPACE/tools/tests/" -o asyncio_default_fixture_loop_scope=function -n 4 --dist=loadfile --max-worker-restart=0 -p pytest_ci_schedule --no-loadscope-reorder --ci-first-file=tools/tests/test_bench_transport.py -p pytest_ci_timing --ci-timing-output=test-worker-timings.json --ci-progress-dir=test-worker-progress -q -W error --tb=short --junitxml=test-results.xml --durations=20

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        # Forks retain coverage artifacts without requiring Codecov credentials.
        if: always() && matrix.suite == 'server' && matrix.python-version == '3.14' && github.repository == 'CoplayDev/unity-mcp'
        # Upload/download outages must not fail the successful test gate.
        continue-on-error: true
        with:
          files: ./Server/coverage.xml
          flags: python
          name: python-coverage-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Capture compact timing snapshot
        if: always()
        continue-on-error: true
        env:
          TIMING_PYTHON: ${{ matrix.python-version }}
          TIMING_SUITE: ${{ matrix.suite }}
        run: |
          cd Server
          options=(--workers 4)
          if [ "$TIMING_SUITE" = server ] && [ "$TIMING_PYTHON" = 3.14 ]; then options+=(--coverage); fi
          uv run --python "$TIMING_PYTHON" --locked --extra dev python ../tools/ci_test_performance.py snapshot \
            --junit test-results.xml --nested-junit test-results-http.xml \
            --worker-timings test-worker-timings.json \
            --python "$TIMING_PYTHON" --suite "$TIMING_SUITE" "${options[@]}" \
            --output "../.tmp/test-timings/$TIMING_PYTHON-$TIMING_SUITE.json"

      - name: Upload compact timing snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: pytest-timing-${{ matrix.python-version }}-${{ matrix.suite }}
          path: .tmp/test-timings/*.json
          include-hidden-files: true
          retention-days: ${{ job.status == 'success' && 7 || 30 }}

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pytest-results-${{ matrix.python-version }}-${{ matrix.suite }}
          path: |
            Server/test-results.xml
            Server/.release-evidence/
            Server/test-results-http.xml
            Server/test-worker-timings.json
            Server/test-worker-progress/
            Server/coverage.xml
            Server/htmlcov/
          include-hidden-files: true
          retention-days: ${{ job.status == 'success' && 7 || 30 }}

  performance_report:
    name: Python timing report
    needs: [test]
    if: always() && !cancelled() && !inputs.defer_performance_report
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/python-performance.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
