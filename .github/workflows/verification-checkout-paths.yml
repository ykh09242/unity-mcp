name: Verification checkout paths

on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/verification-checkout-paths.yml
      - Server/src/services/verification/**
      - Server/tests/test_verification_checkout_paths.py
      - Server/pyproject.toml
      - Server/uv.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-paths:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26-intel, windows-latest]
    env:
      UNITY_MCP_DISABLE_TELEMETRY: '1'
      GIT_AUTHOR_DATE: '2026-10-20T00:00:00Z'
      GIT_COMMITTER_DATE: '2026-10-20T00:00:00Z'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record the checked-out revision
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'verification-checkout-paths'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:GITHUB_SHA) { throw 'Unexpected revision' }
          Set-Content -LiteralPath (Join-Path $evidence 'candidate-sha.txt') -Value $revision
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          python-version: '3.14'
          enable-cache: false
      - name: Install locked test dependencies
        run: uv sync --project Server --python 3.14 --locked --extra dev
      - name: Observe actual checkout paths
        working-directory: Server
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'verification-checkout-paths/pytest-junit.xml'
          uv run --no-sync python -m pytest -q -o junit_family=xunit1 --junitxml $output tests/test_verification_checkout_paths.py tests/test_verification_checkout_diagnostics.py
      - name: Retain Git and filesystem observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-checkout-paths-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification-checkout-paths/
          if-no-files-found: error
          retention-days: 30
