name: Work Program Web

on:
  pull_request:
    paths:
      - tools/feature_program_web/**
      - tools/feature_program_web.py
      - .github/workflows/work-program-web.yml
  push:
    paths:
      - tools/feature_program_web/**
      - tools/feature_program_web.py
      - .github/workflows/work-program-web.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/feature_program_web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/feature_program_web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify committed bundle matches source
        run: |
          git diff --exit-code -- generated
          test -z "$(git ls-files --others --exclude-standard -- generated)"
