name: github-repo-stats

on:
  # schedule:
    # Run this once per day, towards the end of the day for keeping the most
    # recent data point most meaningful (hours are interpreted in UTC).
    #- cron: "0 23 * * *"
  workflow_dispatch: # Allow for running this manually.

# This action uses its explicit API credential, not the workflow token.
permissions: {}

jobs:
  j1:
    if: github.repository == 'CoplayDev/unity-mcp'
    name: github-repo-stats
    runs-on: ubuntu-latest
    steps:
      - name: run-ghrs
        # Pin the maintained RELEASE branch; its last versioned tag predates it.
        uses: jgehrcke/github-repo-stats@d80572c9029636cd0e97e3a79e7a9c293bea3b02 # RELEASE (2025-08-22)
        with:
          ghtoken: ${{ secrets.ghrs_github_api_token }}
