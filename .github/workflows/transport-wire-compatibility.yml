name: Transport wire compatibility

on:
  pull_request:
    branches: [main, beta]
    paths: &wire_paths
      - MCPForUnity/Editor/Constants/ProductInfo.cs
      - MCPForUnity/Editor/Models/Command.cs
      - MCPForUnity/Editor/Services/ToolOperationPolicy.generated.cs
      - MCPForUnity/Editor/Services/Transport/**
      - MCPForUnity/package.json
      - Server/src/**
      - Server/README.md
      - Server/pyproject.toml
      - Server/uv.lock
      - tools/check_transport_wire.py
      - tools/player_e2e_artifacts.py
      - tools/player_e2e_process.py
      - tools/run_dotnet.py
      - tools/run_stable_workflow_upgrade.py
      - tools/unity_ci_packages.py
      - tools/tests/fixtures/transport_wire/**
      - tools/tests/test_ci_candidate.py
      - .github/workflows/transport-wire-compatibility.yml
  push:
    branches: [beta]
    paths: *wire_paths
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: "Git ref to compare (defaults to the triggering SHA)."
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  wire:
    name: Stable and candidate C# / Python wire pairs
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          # The stable tag and the package-pinned server commit are distinct objects.
          fetch-depth: 0
      - name: Record checked candidate
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "$CANDIDATE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            test "$actual" = "$CANDIDATE_REF"
          fi
          printf 'Checked candidate: `%s`\n' "$actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.14"
          enable-cache: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.100
          skip-lts-prepass: true
      - name: Compare wire pairs and model the candidate lifecycle
        shell: bash
        run: uv run --project Server --locked python tools/check_transport_wire.py --output "$RUNNER_TEMP/transport-wire"
      - name: Retain wire comparison and any model reproducer
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transport-wire-compatibility
          path: |
            ${{ runner.temp }}/transport-wire/comparison.json
            ${{ runner.temp }}/transport-wire/reproducer.json
          retention-days: 30
