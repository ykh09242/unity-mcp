name: Fork Beta Tool Tests

# beta-release.yml validates Server/MCPForUnity changes. Tooling and CI-policy
# fork beta pushes need their own trigger without expanding release triggers.
on:
  push:
    branches: [beta]
    paths:
      - tools/**
      - mcp_source.py
      - .github/scripts/**
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml

permissions:
  contents: read

concurrency:
  group: fork-beta-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python_tests:
    name: Python and hermetic tool tests
    if: github.repository != 'CoplayDev/unity-mcp'
    uses: ./.github/workflows/python-tests.yml
