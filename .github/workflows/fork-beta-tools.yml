name: Fork Beta Tool Tests

# This is the single Python validation entry point for fork beta pushes.
# Keep product, tooling and CI-policy paths together so mixed pushes run once.
# beta-release.yml retains upstream Python validation and the Unity gate.
on:
  push:
    branches: [beta]
    paths:
      - Server/**
      - MCPForUnity/**
      - tools/**
      - manifest.json
      - unity-mcp-skill/**
      - .claude/skills/**
      - mcp_source.py
      - .github/scripts/**
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml

permissions:
  contents: read

concurrency:
  group: fork-beta-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python_tests:
    name: Python and hermetic tool tests
    if: github.repository != 'CoplayDev/unity-mcp'
    uses: ./.github/workflows/python-tests.yml
