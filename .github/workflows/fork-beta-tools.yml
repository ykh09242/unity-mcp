name: Fork Beta Tool Tests

# This is the single Python and native Unity entry point for fork beta pushes.
# Keep product, tooling and CI-policy paths together so mixed pushes run once.
# beta-release.yml retains upstream release validation.
on:
  push:
    branches: [beta]
    paths:
      - Server/**
      - MCPForUnity/**
      - CustomTools/**
      - website/docs/reference/tools/**
      - TestProjects/UnityMCPTests/**
      - tools/**
      - manifest.json
      - unity-mcp-skill/**
      - .claude/skills/**
      - mcp_source.py
      - .github/scripts/**
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
      - '!tools/feature_program*.py'
      - '!tools/feature_program_web/**'
      - '!tools/tests/test_feature_program*.py'
      - '!.github/workflows/work-program-python.yml'
      - '!.github/workflows/work-program-web.yml'

permissions:
  contents: read

concurrency:
  group: fork-beta-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select validation scope
    if: github.repository != 'CoplayDev/unity-mcp'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      profile: ${{ steps.scope.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Pushes can contain multiple commits; inspect the complete before/after range.
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_scope.py select

  python_tests:
    name: Python and hermetic tool tests
    needs: [changes]
    if: github.repository != 'CoplayDev/unity-mcp'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/python-tests.yml
    with:
      validation_profile: ${{ needs.changes.outputs.profile }}
      defer_performance_report: true

  unity_tests:
    name: Unity and optional integration tests
    needs: [changes]
    if: github.repository != 'CoplayDev/unity-mcp' && needs.changes.outputs.profile == 'full'
    uses: ./.github/workflows/unity-tests.yml
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

  performance_report:
    name: CI performance report
    needs: [python_tests, unity_tests]
    if: always() && !cancelled() && github.repository != 'CoplayDev/unity-mcp'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/python-performance.yml
    with:
      include_ci_stages: true

  validation:
    name: Selected validation
    needs: [changes, python_tests, unity_tests]
    if: always() && github.repository != 'CoplayDev/unity-mcp'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require selected checks
        env:
          PROFILE: ${{ needs.changes.outputs.profile }}
          CLASSIFICATION: ${{ needs.changes.result }}
          PYTHON_RESULT: ${{ needs.python_tests.result }}
          UNITY_RESULT: ${{ needs.unity_tests.result }}
        run: |
          python3 tools/ci_scope.py check --profile "$PROFILE" --classification "$CLASSIFICATION" \
            --python "$PYTHON_RESULT" --unity "$UNITY_RESULT"
