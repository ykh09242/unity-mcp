name: Unlocked distribution canary

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  canary:
    name: Pinned launcher archive (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      # Match the locked 3.15 suite policy for optional py-key-value instrumentation.
      PY_KEY_VALUE_DISABLE_BEARTYPE: ${{ matrix.python-version == '3.15' && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.11'
          - os: macos-26-intel
            python-version: '3.11'
          - os: ubuntu-26.04
            python-version: '3.14'
          - os: ubuntu-26.04
            python-version: '3.15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select committed launcher source
        id: source
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          repo = Path.cwd()
          sys.path.insert(0, str(repo / 'tools'))
          from check_source_pin_drift import BASE, source_pin

          checked = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          pin = source_pin(repo, checked)
          source = BASE + '/archive/' + pin + '.zip#subdirectory=Server'
          report = {'checked_commit': checked, 'server_commit': pin, 'server_source': source}
          output = repo / '.tmp' / 'distribution-canary'
          output.mkdir(parents=True, exist_ok=True)
          (output / 'source.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('server_commit=' + pin + '\nserver_source=' + source + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write('Launcher metadata commit: `' + checked + '`\n\n')
              stream.write('Fresh unlocked installation: `' + source + '`\n')

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Resolve and install the pinned archive without a lock or shared cache
        env:
          SERVER_SOURCE: ${{ steps.source.outputs.server_source }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $environment = Join-Path $env:RUNNER_TEMP 'distribution-canary'
          uv venv --no-config --python $env:PYTHON_VERSION $environment
          if ($LASTEXITCODE -ne 0) { throw 'Canary environment creation failed' }
          $python = if ($IsWindows) { Join-Path $environment 'Scripts/python.exe' } else { Join-Path $environment 'bin/python' }
          uv --version > .tmp/distribution-canary/toolchain.txt
          & $python --version >> .tmp/distribution-canary/toolchain.txt
          uv pip install --no-config --no-cache --python $python "ykh09242-unity-mcp-server @ $env:SERVER_SOURCE" 2>&1 | Tee-Object -FilePath .tmp/distribution-canary/install.log
          if ($LASTEXITCODE -ne 0) { throw 'Unlocked canary installation failed' }
          uv pip freeze --no-config --python $python > .tmp/distribution-canary/resolved.txt
          if ($LASTEXITCODE -ne 0) { throw 'Canary resolution evidence failed' }
          "CANARY_PYTHON=$python" >> $env:GITHUB_ENV

      - name: Exercise installed registration, MCP, HTTP and CLI behavior
        env:
          SERVER_COMMIT: ${{ steps.source.outputs.server_commit }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:CANARY_PYTHON -I -W error tools/check_server_archive.py --forbid-source $env:GITHUB_WORKSPACE --candidate-sha $env:SERVER_COMMIT > .tmp/distribution-canary/behavior.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed canary behavior failed' }
          & $env:CANARY_PYTHON -I -W error tools/check_server_startup.py > .tmp/distribution-canary/registration.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Installed canary registration failed' }
          Get-Content .tmp/distribution-canary/behavior.json
          Get-Content .tmp/distribution-canary/registration.jsonl
          "Installed registration, stdio/authenticated HTTP MCP and HTTP/CLI probes passed. Resolved versions are retained in the artifact." >> $env:GITHUB_STEP_SUMMARY

      - name: Retain source, resolution and probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-canary-${{ matrix.os }}-python-${{ matrix.python-version }}-${{ github.run_id }}
          path: .tmp/distribution-canary/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
