name: Unlocked distribution canary

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      qualification_run:
        description: Run as the release qualification evidence owner, including on caller push events
        type: boolean
        default: false
  pull_request:
    branches: [main, beta]
    paths: &source-inputs
      - MCPForUnity/package.json
      - manifest.json
      - release-source-inputs.json
      - tools/check_server_archive.py
      - tools/check_server_startup.py
      - tools/check_source_pin_drift.py
      - tools/check_release_evidence.py
      - tools/ci_archive_attempts.py
      - tools/ci_archive_evidence.py
      - tools/ci_archive_install_report.py
      - tools/ci_archive_install_history.py
      - .github/actions/archive-checkpoint/**
      - .github/actions/report-archive-install/**
      - .github/workflows/archive-attempts.yml
      - tools/tests/test_distribution_canary.py
      - .github/workflows/distribution-canary.yml
  push:
    branches: [beta]
    paths: *source-inputs
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  canary:
    # Reusable workflows retain the caller event. Qualification explicitly owns
    # licensed beta pushes; direct license-free, PR, manual and scheduled runs stay available.
    if: inputs.qualification_run || github.event_name != 'push' || github.ref != 'refs/heads/beta' || vars.UNITY_RUN_LICENSED_TESTS != 'true'
    name: Pinned launcher archive (${{ matrix.os }}, Python ${{ matrix.python-version }})
    permissions:
      contents: read
      actions: read
    runs-on: ${{ matrix.os }}
    # Match the candidate's cold-build allowance on the Intel macOS runner.
    timeout-minutes: ${{ startsWith(matrix.os, 'macos') && 20 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        # Changed pins must exercise the same installed behavior as qualification.
        include:
          - {os: ubuntu-26.04, python-version: '3.11'}
          - {os: windows-latest, python-version: '3.11'}
          - {os: macos-26-intel, python-version: '3.11'}
          - {os: ubuntu-26.04, python-version: '3.14'}
          - {os: ubuntu-26.04, python-version: '3.15'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Select committed launcher source
        id: source
        env:
          EXPECTED_SHA: ${{ inputs.ref || github.sha }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          repo = Path.cwd()
          sys.path.insert(0, str(repo / 'tools'))
          from check_source_pin_drift import BASE, source_pin

          checked = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert checked == os.environ['EXPECTED_SHA'], 'Checkout must match the exact requested SHA'
          pin = source_pin(repo, checked)
          source = BASE + '/archive/' + pin + '.zip#subdirectory=Server'
          report = {'checked_commit': checked, 'server_commit': pin, 'server_source': source}
          output = repo / '.tmp' / 'distribution-canary'
          output.mkdir(parents=True, exist_ok=True)
          (output / 'source.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('server_commit=' + pin + '\nserver_source=' + source + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write('Launcher metadata commit: `' + checked + '`\n\n')
              stream.write('Fresh unlocked installation: `' + source + '`\n')

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Preserve installer checkpoint
        id: checkpoint
        uses: ./.github/actions/archive-checkpoint
        with:
          kind: published
          platform: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}
      - name: Resolve and install the pinned archive without a lock or shared cache
        id: archive_install
        if: ${{ !cancelled() && (success() || steps.checkpoint.outcome == 'failure') }}
        timeout-minutes: ${{ startsWith(matrix.os, 'macos') && 18 || 10 }}
        env:
          SERVER_SOURCE: ${{ steps.source.outputs.server_source }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $environment = Join-Path $env:RUNNER_TEMP 'distribution-canary'
          uv venv --no-config --python $env:PYTHON_VERSION $environment
          if ($LASTEXITCODE -ne 0) { throw 'Canary environment creation failed' }
          $python = if ($IsWindows) { Join-Path $environment 'Scripts/python.exe' } else { Join-Path $environment 'bin/python' }
          uv --version > .tmp/distribution-canary/toolchain.txt
          & $python --version >> .tmp/distribution-canary/toolchain.txt
          uv pip install --no-config --no-cache --python $python "ykh09242-unity-mcp-server @ $env:SERVER_SOURCE" 2>&1 | Tee-Object -FilePath .tmp/distribution-canary/install.log
          if ($LASTEXITCODE -ne 0) { throw 'Unlocked canary installation failed' }
          uv pip freeze --no-config --python $python > .tmp/distribution-canary/resolved.txt
          if ($LASTEXITCODE -ne 0) { throw 'Canary resolution evidence failed' }
          "CANARY_PYTHON=$python" >> $env:GITHUB_ENV

      - name: Exercise installed registration, MCP, HTTP and CLI behavior
        if: ${{ !cancelled() && steps.archive_install.outcome == 'success' }}
        env:
          SERVER_COMMIT: ${{ steps.source.outputs.server_commit }}
          SERVER_SOURCE: ${{ steps.source.outputs.server_source }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess

          python = [os.environ['CANARY_PYTHON'], '-I', '-W', 'error', '-X', 'utf8']
          python_version, storage_version = json.loads(subprocess.check_output([
              *python, '-c',
              "import json, platform; from importlib.metadata import version; "
              "print(json.dumps([platform.python_version(), version('py-key-value-aio')]))",
          ], text=True))
          probe_env = dict(os.environ)
          flag = 'PY_KEY_VALUE_DISABLE_BEARTYPE'
          probe_env.pop(flag, None)
          # Storage 0.4.x needs the workaround on Python 3.15. The fix shipped in 0.5.0.
          if python_version.split('.')[:2] == ['3', '15'] and storage_version.startswith('0.4.'):
              probe_env[flag] = 'true'

          output = Path('.tmp/distribution-canary')
          runtime = {
              'python_version': python_version,
              'py_key_value_aio_version': storage_version,
              flag: probe_env.get(flag),
          }
          runtime_json = json.dumps(runtime, indent=2)
          (output / 'runtime-type-checks.json').write_text(runtime_json + '\n', encoding='utf-8')
          print(runtime_json, flush=True)
          mode = 'disabled (legacy override)' if flag in probe_env else 'enabled (default)'
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a', encoding='utf-8') as stream:
              stream.write(f'\nRuntime type checks: {mode} with py-key-value-aio {storage_version} '
                           f'on Python {python_version}.\n')

          with (output / 'behavior.json').open('w', encoding='utf-8') as stream:
              subprocess.run([
                  *python, 'tools/check_server_archive.py',
                  '--forbid-source', os.environ['GITHUB_WORKSPACE'],
                  '--candidate-sha', os.environ['SERVER_COMMIT'],
                  '--archive-source', os.environ['SERVER_SOURCE'],
              ], env=probe_env, stdout=stream, check=True)
          with (output / 'registration.jsonl').open('w', encoding='utf-8') as stream:
              subprocess.run([*python, 'tools/check_server_startup.py'],
                             env=probe_env, stdout=stream, check=True)
          print((output / 'behavior.json').read_text(encoding='utf-8'))
          print((output / 'registration.jsonl').read_text(encoding='utf-8'))
          with summary.open('a', encoding='utf-8') as stream:
              stream.write('\nInstalled registration, stdio/authenticated HTTP MCP and HTTP/CLI '
                           'probes passed. Resolved versions are retained in the artifact.\n')

      - name: Retain source, resolution and probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-canary-${{ matrix.os }}-python-${{ matrix.python-version }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .tmp/distribution-canary/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Compare archive installation
        if: always() && steps.archive_install.outcome != 'skipped'
        timeout-minutes: 2
        uses: ./.github/actions/report-archive-install
        with:
          kind: published
          platform: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}
          evidence: .tmp/distribution-canary
          outcome: ${{ steps.archive_install.outcome }}

  archive_attempts:
    needs: [canary]
    if: always() && needs.canary.result != 'skipped'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/archive-attempts.yml
    with:
      kind: published
      ref: ${{ inputs.ref || github.sha }}
