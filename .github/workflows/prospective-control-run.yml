name: Run one prospective selection

on:
  workflow_call:
    inputs:
      role:
        type: string
        required: true
    outputs:
      artifact:
        value: ${{ jobs.execute.outputs.artifact }}

permissions:
  contents: read

jobs:
  execute:
    name: Observe ${{ inputs.role }}
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    outputs:
      artifact: ${{ steps.receipt.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prospective-plan-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/sealed
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          python-version: '3.14'
          enable-cache: false
      - name: Execute the sealed selection
        id: execute
        continue-on-error: true
        working-directory: candidate
        env:
          ROLE: ${{ inputs.role }}
          PYTHONPATH: ${{ github.workspace }}/candidate/tools
        run: |
          uv sync --project Server --python 3.14 --locked --extra dev
          Server/.venv/bin/python ../policy/tools/prospective_pytest_runner.py "$ROLE" \
            "$RUNNER_TEMP/$ROLE.json" --plan "$RUNNER_TEMP/sealed/plan.json"
      - name: Pytest returned failure
        if: steps.execute.outcome == 'failure'
        run: echo 'The host observed a failed invocation.'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: receipt
        if: always()
        with:
          name: prospective-run-${{ inputs.role }}
          path: ${{ runner.temp }}/${{ inputs.role }}.json
          if-no-files-found: ignore
          retention-days: 90
