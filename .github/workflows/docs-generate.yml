name: Docs — Reference Drift Check

# Fails a PR if the committed /website/docs/reference/ output disagrees
# with what tools/generate_docs_reference.py would produce from the live
# Python tool/resource registry. Contributors should regenerate locally:
#
#   cd Server && uv run python ../tools/generate_docs_reference.py
#
# or install the pre-commit hook to make this automatic:
#
#   tools/install-hooks.sh

on:
  pull_request:
    branches: [beta, main]
    paths:
      - Server/src/services/tools/**
      - Server/src/services/resources/**
      - Server/src/services/registry/**
      - Server/src/services/declared_action_contracts.py
      - Server/src/services/addressable_prefab.py
      - Server/src/services/operation_permissions.py
      - Server/src/cli/**
      # CLI ranges and registration depend on shared models; version metadata
      # is resolved through core.telemetry and the Server project metadata.
      - Server/src/models/**
      - Server/src/core/telemetry.py
      - Server/pyproject.toml
      - Server/uv.lock
      - tools/cli_reference.py
      - tools/cli_example_validation.py
      - website/docs/guides/cli.md
      - website/docs/guides/cli-examples.md
      - website/docs/guides/multi-instance.md
      - website/docs/reference/**
      - tools/generate_docs_reference.py
      - tools/public_contracts.py
      - Server/tests/fixtures/public_mcp_contracts.json
      - tools/generate_tool_capabilities.py
      - tools/generate_declared_action_contracts.py
      - MCPForUnity/Editor/Tools/ToolCapabilities.generated.cs
      - MCPForUnity/Editor/Tools/DeclaredActionContracts.generated.cs
      - .github/workflows/docs-generate.yml
  push:
    branches: [beta]
    paths:
      - Server/src/services/tools/**
      - Server/src/services/resources/**
      - Server/src/services/registry/**
      - Server/src/services/declared_action_contracts.py
      - Server/src/services/addressable_prefab.py
      - Server/src/services/operation_permissions.py
      - Server/src/cli/**
      # Keep shared CLI metadata inputs aligned with the PR trigger above.
      - Server/src/models/**
      - Server/src/core/telemetry.py
      - Server/pyproject.toml
      - Server/uv.lock
      - tools/cli_reference.py
      - tools/cli_example_validation.py
      - website/docs/guides/cli.md
      - website/docs/guides/cli-examples.md
      - website/docs/guides/multi-instance.md
      - website/docs/reference/**
      - tools/generate_docs_reference.py
      - tools/public_contracts.py
      - Server/tests/fixtures/public_mcp_contracts.json
      - tools/generate_tool_capabilities.py
      - tools/generate_declared_action_contracts.py
      - MCPForUnity/Editor/Tools/ToolCapabilities.generated.cs
      - MCPForUnity/Editor/Tools/DeclaredActionContracts.generated.cs
      - .github/workflows/docs-generate.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Check docs reference is fresh
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.14"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync Server deps
        working-directory: Server
        run: uv sync --locked --python 3.14

      - name: Drift check
        working-directory: Server
        run: uv run --locked --python 3.14 python ../tools/generate_docs_reference.py --check

      - name: Check native feature catalog
        working-directory: Server
        run: uv run --locked --python 3.14 python ../tools/generate_tool_capabilities.py --check

      - name: Check native action input contracts
        run: python3 tools/generate_declared_action_contracts.py --check

      - name: Check authored resource URI references
        run: >-
          uv run --project Server --locked --extra dev --python 3.14 python -m pytest
          Server/tests/test_resource_uri_references.py
          -q -W error -p no:cacheprovider -o asyncio_default_fixture_loop_scope=function
