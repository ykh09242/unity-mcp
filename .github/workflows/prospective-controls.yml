name: Prospective PR controls
run-name: Controls ${{ github.event.pull_request.number }} ${{ github.workflow_sha }}

on:
  pull_request:
    branches: [beta]
    types: [opened]
permissions:
  contents: read

jobs:
  eligibility:
    if: github.event_name == 'pull_request' && github.run_attempt == 1
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.enroll.outputs.admitted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: enroll
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          admitted=$(python3 tools/prospective_pr.py eligible "$NUMBER")
          echo "admitted=$admitted" >> "$GITHUB_OUTPUT"
  inventory:
    needs: eligibility
    outputs:
      artifact: ${{ steps.receipt.outputs.artifact-id }}
    if: needs.eligibility.outputs.admitted == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          python-version: '3.14'
          enable-cache: false
      - name: Collect the whole tools-suite inventory
        working-directory: candidate
        env:
          PYTHONPATH: ${{ github.workspace }}/candidate/tools
        run: |
          uv sync --project Server --python 3.14 --locked --extra dev
          Server/.venv/bin/python ../policy/tools/prospective_pytest_runner.py inventory "$RUNNER_TEMP/inventory.json"
      - id: receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prospective-discovery
          path: ${{ runner.temp }}/inventory.json
          if-no-files-found: error
          retention-days: 90

  plan:
    needs: inventory
    outputs:
      artifact: ${{ steps.receipt.outputs.artifact-id }}
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.inventory.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/collected
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          python-version: '3.14'
          enable-cache: false
      - name: Seal the opening description and automatic plan
        working-directory: candidate
        env:
          PROSPECTIVE_POLICY: ${{ github.workspace }}/policy
        run: |
          uv sync --project ../policy/Server --python 3.14 --locked
          ../policy/Server/.venv/bin/python ../policy/tools/prospective_pr.py freeze \
            "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/collected/inventory.json" "$RUNNER_TEMP/plan.json"
      - id: receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prospective-plan-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/plan.json
          if-no-files-found: error
          retention-days: 90

  manual:
    needs: plan
    uses: ./.github/workflows/prospective-control-run.yml
    with:
      role: manual

  automatic:
    needs: plan
    uses: ./.github/workflows/prospective-control-run.yml
    with:
      role: automatic

  full:
    needs: plan
    uses: ./.github/workflows/prospective-control-run.yml
    with:
      role: full

  receipts:
    name: Evidence ${{ needs.inventory.outputs.artifact || '0' }}-${{ needs.plan.outputs.artifact || '0' }}-${{ needs.manual.outputs.artifact || '0' }}-${{ needs.automatic.outputs.artifact || '0' }}-${{ needs.full.outputs.artifact || '0' }}
    needs: [inventory, plan, manual, automatic, full]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - run: echo 'GitHub job metadata retains the artifact IDs returned by each producer.'
