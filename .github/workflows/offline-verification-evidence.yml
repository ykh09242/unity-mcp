name: Offline verification evidence

on:
  pull_request:
    branches: [main, beta]
    paths:
      - Server/**
      - tools/build_offline_evidence.py
      - tools/check_offline_evidence.py
      - tools/check_team_evidence.py
      - tools/benchmark_nunit_reader.py
      - .github/workflows/offline-verification-evidence.yml
  push:
    branches: [beta]
    paths:
      - Server/**
      - tools/build_offline_evidence.py
      - tools/check_offline_evidence.py
      - tools/check_team_evidence.py
      - tools/benchmark_nunit_reader.py
      - .github/workflows/offline-verification-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-evidence:
    name: Clean offline installation and NUnit streaming
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      team-expectations: ${{ steps.team.outputs.expectations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.14"
          enable-cache: false
      - name: Build wheel and install both distributions in clean environments
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.14 python tools/build_offline_evidence.py --output .tmp/offline-wheel
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/server" uv sync --project Server --python 3.14 --locked --no-dev --no-editable
          uv venv --python 3.14 "$RUNNER_TEMP/offline"
          uv pip install --python "$RUNNER_TEMP/offline/bin/python" .tmp/offline-wheel/*.whl
      - name: Compare shared sources, installed verdicts, exit codes and first read
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/server/bin/python" tools/check_offline_evidence.py \
            --full "$RUNNER_TEMP/server/bin/unity-mcp" --lean "$RUNNER_TEMP/offline/bin/unity-mcp-evidence" \
            --output "$RUNNER_TEMP/evidence"
      - name: Export redacted handoff from installed server
        id: team
        run: |
          "$RUNNER_TEMP/server/bin/python" tools/check_team_evidence.py produce "$RUNNER_TEMP/server/bin/unity-mcp" \
            "$RUNNER_TEMP/evidence/fixtures" "$RUNNER_TEMP/team-handoff"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: team-handoff-for-replay
          path: ${{ runner.temp }}/team-handoff/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Compare NUnit readers on the same inputs
        shell: bash
        run: |
          set -euo pipefail
          baseline=913059dd46d4d3b3634324d138e2af07efbfc3d5
          git show "$baseline:Server/src/cli/utils/verification_selection.py" > "$RUNNER_TEMP/legacy_selection.py"
          "$RUNNER_TEMP/server/bin/python" tools/benchmark_nunit_reader.py \
            --legacy-source "$RUNNER_TEMP/legacy_selection.py" --output "$RUNNER_TEMP/evidence"
          printf 'Candidate `%s`, legacy NUnit reader `%s`\n' "$(git rev-parse HEAD)" "$baseline" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: offline-verification-evidence
          path: |
            .tmp/offline-wheel/*.whl
            ${{ runner.temp }}/evidence/*.json
          include-hidden-files: true
          retention-days: 30

  teammate:
    name: Recompute shared verdicts on an independent offline runner
    needs: installed-evidence
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.14"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: offline-verification-evidence
          path: ${{ runner.temp }}/reader-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: team-handoff-for-replay
          path: ${{ runner.temp }}/received
      - name: Install reader and replay with no external network interfaces
        env:
          TEAM_EXPECTATIONS: ${{ needs.installed-evidence.outputs.team-expectations }}
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find "$RUNNER_TEMP/reader-dist" -name '*.whl' -type f)
          test "${#wheels[@]}" -eq 1
          uv venv --python 3.14 "$RUNNER_TEMP/teammate"
          uv pip install --python "$RUNNER_TEMP/teammate/bin/python" "${wheels[0]}"
          sudo -n --preserve-env=TEAM_EXPECTATIONS unshare --net -- \
            "$RUNNER_TEMP/teammate/bin/python" tools/check_team_evidence.py replay \
            "$RUNNER_TEMP/teammate/bin/unity-mcp-evidence" "$RUNNER_TEMP/received" "$RUNNER_TEMP/team-replay.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teammate-offline-replay
          path: ${{ runner.temp }}/team-replay.json
          if-no-files-found: error
          retention-days: 30
