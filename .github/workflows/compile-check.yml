name: Compile Check (no license)

# Real semantic compile verification for EVERY pull request, including forks.
#
# unity-tests.yml needs Unity license secrets, and GitHub withholds secrets from runs
# triggered by a fork's pull request -- so it skips and reports a green check having
# compiled nothing. Since practically every PR to this repo comes from a fork, that has
# meant no PR was ever compile-verified.
#
# This job never launches the Unity Editor, so it needs no license and no secrets. It
# reads reference assemblies from pinned public GameCI images or official preview
# archives, and drives Roslyn (Unity's own bundled csc) directly. See tools/compile-check.sh.
#
# It does NOT replace unity-tests.yml: this compiles, it does not run tests.

on:
  workflow_dispatch: {}
  push:
    # Beta's release gates need a Unity license; this independent check also
    # compiles fork beta pushes where licensed tests are skipped.
    branches-ignore: [main]
    paths: &paths
      - MCPForUnity/Editor/**
      - MCPForUnity/Runtime/**
      - MCPForUnity/package.json
      - TestProjects/UnityMCPTests/**
      - tools/compile-check.sh
      - tools/compile-defines.txt
      - tools/compile-refs/**
      - tools/unity-versions.json
      - tools/unity_ci.py
      - tools/unity-ci/**
      - tools/unity_ci_packages.py
      - tools/unity-ci-packages.json
      - .github/workflows/compile-check.yml
  pull_request:
    branches: [main, beta]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: compile-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Compute Unity compile matrix
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tools/unity-versions.json
            tools/unity_ci.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Select all supported Unity channels
        id: set
        run: |
          set -euo pipefail
          versions=$(python3 tools/unity_ci.py matrix)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  compile:
    name: Compile ${{ matrix.unity.channel }} Unity ${{ matrix.unity.version }} (win/osx/linux)
    needs: [matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        unity: ${{ fromJson(needs.matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Unity Editor image
        id: editor
        env:
          UNITY_VERSION: ${{ matrix.unity.version }}
        run: |
          set -euo pipefail
          # Validate the test image even when the licensed workflow is skipped.
          python3 tools/unity_ci.py prepare "$UNITY_VERSION" --purpose tests

      - name: Prepare version-specific test packages
        id: packages
        env:
          UNITY_VERSION: ${{ matrix.unity.version }}
          UNITY_IMAGE: ${{ steps.editor.outputs.image }}
        run: |
          set -euo pipefail
          python3 tools/unity_ci_packages.py prepare \
            --unity-version "$UNITY_VERSION" --image "$UNITY_IMAGE" \
            --output ".unity-ci/$UNITY_VERSION"

      - name: Compile
        env:
          UNITY_VERSION: ${{ matrix.unity.version }}
          UNITY_IMAGE: ${{ steps.editor.outputs.image }}
          EXTRA_REFS: ${{ steps.packages.outputs.refs }}
          TEST_FRAMEWORK_SOURCE: ${{ steps.packages.outputs.test_framework_source }}
          TEST_PROJECT: ${{ steps.packages.outputs.project_path }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            -e UNITY_VERSION="$UNITY_VERSION" \
            -e UNITY_DATA=/opt/unity/Editor/Data \
            -e REPO=/repo \
            -e EXTRA_REFS="/repo/$EXTRA_REFS" \
            -e TEST_FRAMEWORK_SOURCE="/repo/$TEST_FRAMEWORK_SOURCE" \
            -e TEST_PROJECT="/repo/$TEST_PROJECT" \
            "$UNITY_IMAGE" \
            bash /repo/tools/compile-check.sh

      - name: Upload package resolution
        if: always() && steps.packages.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Unity package profile ${{ matrix.unity.version }}
          path: ${{ steps.packages.outputs.resolution_report }}
          if-no-files-found: error
          # Only the resolution JSON is selected, not the hidden package/cache tree.
          include-hidden-files: true

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            {
              echo "## Compile check passed"
              echo
              echo "MCP runtime, Editor and EditMode test assemblies compiled against Unity"
              echo "\`${{ matrix.unity.version }}\` (${{ matrix.unity.channel }}) reference assemblies for **win, osx and linux**."
              echo
              echo "No Unity license was used, so this runs on fork PRs too."
              echo "Note: this compiles the code, it does not run the test suite."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Compile check FAILED"
              echo
              echo "Unity \`${{ matrix.unity.version }}\` (${{ matrix.unity.channel }}) compilation or preparation failed."
              echo "See the Compile step log for the exact errors and the platform each belongs to."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
