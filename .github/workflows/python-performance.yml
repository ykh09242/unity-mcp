name: Python performance report

on:
  workflow_call:
    inputs:
      ref:
        description: "Source ref for the reporting code (defaults to the triggering commit)."
        type: string
        required: false
        default: ""
      include_ci_stages:
        description: "Also publish stages after the caller's selected validation jobs finish."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  report:
    name: Python timing report
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: pytest-timing-*
          path: .tmp/test-timings
          merge-multiple: true
      - name: Compare recent successful runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci_test_performance.py report --current .tmp/test-timings \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --output .tmp/performance-report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-test-timings
          path: .tmp/performance-report/
          include-hidden-files: true
          retention-days: 30
      - name: Record completed CI stages
        if: always() && inputs.include_ci_stages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci_test_performance.py stages --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --output .tmp/ci-stage-timings
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && inputs.include_ci_stages
        with:
          name: ci-stage-timings
          path: .tmp/ci-stage-timings/
          include-hidden-files: true
          retention-days: 30
